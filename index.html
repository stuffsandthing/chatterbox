<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatterbox</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M14 16h36a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H30l-10 9v-9h-6a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z' fill='white'/%3E%3Ccircle cx='23' cy='30' r='3' fill='%234f46e5'/%3E%3Ccircle cx='32' cy='30' r='3' fill='%234f46e5'/%3E%3Ccircle cx='41' cy='30' r='3' fill='%234f46e5'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1c1e21;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent-text:#fff;--me:#4f46e5;--me-text:#fff;--other:#eceef2;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--text:#e8eaed;--muted:#9aa0aa;--line:#2a2e36;--accent:#6366f1;--other:#262a33}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:8px 14px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}

/* auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:380px}
.card h1{margin:0 0 4px;font-size:24px}
.card p.sub{margin:0 0 18px;color:var(--muted)}
.card label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
.card .btn{width:100%;margin-top:18px;padding:11px}
.switch{text-align:center;margin-top:14px;color:var(--muted)}
.switch a{color:var(--accent);cursor:pointer}
.err{color:var(--danger);margin-top:12px;min-height:1em;font-size:14px}
.ok{color:#16a34a}

/* app layout */
#app{height:100%;display:grid;grid-template-columns:340px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.me-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.me-bar .who{flex:1;min-width:0}
.me-bar .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-bar .who span{color:var(--muted);font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:11px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tools{padding:10px 12px;display:flex;gap:8px}
.list{flex:1;overflow-y:auto;min-height:0}
.row{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--bg)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{color:var(--muted);font-size:13px}
.row.unread .t b{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.av.sm{width:30px;height:30px;font-size:13px}
.empty{padding:30px 20px;color:var(--muted);text-align:center}

/* chat */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
#chatHead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#chatHead .t{flex:1;min-width:0}
#chatHead .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHead .t span{color:var(--muted);font-size:13px}
#back{display:none}
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{max-width:min(75%,560px);padding:8px 12px;border-radius:14px;background:var(--other);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{background:var(--me);color:var(--me-text);align-self:flex-end}
.msg .nm{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.msg .tx{white-space:pre-wrap}
.msg .tm{font-size:11px;opacity:.65;margin-top:3px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.msg .del-msg{background:none;border:0;padding:0 2px;font-size:12px;opacity:.55;cursor:pointer;line-height:1}
.msg .del-msg:hover{opacity:1}
.msg.me .del-msg{filter:brightness(2)}
.msg img{max-width:100%;max-height:300px;border-radius:8px;display:block;margin-bottom:4px}
.msg a.file{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;background:rgba(0,0,0,.08);padding:8px 10px;border-radius:8px}
.daysep{align-self:center;color:var(--muted);font-size:12px;margin:8px 0}
#composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
#composer textarea{resize:none;max-height:230px;min-height:40px}
#limitNote{font-size:12px;padding:3px 14px;background:var(--panel);color:var(--muted)}
#upStatus{font-size:13px;color:var(--muted);padding:4px 14px;background:var(--panel)}
#noChat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}

/* avatars */
.av img,.big img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.em{font-size:1.35em;line-height:1}
#meAv{cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.pgrid button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;display:flex;align-items:center;justify-content:center}
.pgrid button.sel{border-color:var(--text)}

/* online / offline dots + calls */
.av{position:relative}
.av.online::after,.av.offline::after{content:'';position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.av.online::after{background:#22c55e}
.av.offline::after{background:#ef4444}
.av.sm.online::after,.av.sm.offline::after{width:10px;height:10px}
#incoming{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.inbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;width:100%;max-width:320px}
.inbox .av{width:72px;height:72px;font-size:30px;margin:0 auto 12px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#inTitle{font-size:18px;font-weight:600}
#inSub{color:var(--muted);margin:4px 0 18px}
.inbtns{display:flex;gap:10px;justify-content:center}
#call{position:fixed;inset:0;background:#0b0d11;z-index:40;display:flex;flex-direction:column;color:#fff}
#callTop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
#callPeople{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;font-size:12px}
.pchip{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;display:flex;gap:6px;align-items:center}
.pchip button{background:#4f46e5;color:#fff;border:0;border-radius:999px;padding:1px 9px;font-size:12px}
#callGrid{flex:1;min-height:0;display:grid;gap:8px;padding:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));grid-auto-rows:1fr}
#callGrid:empty{display:flex;align-items:center;justify-content:center}
#callGrid:empty::before{content:'Waiting for others to join…';color:#9aa0aa}
.tile{position:relative;background:#1b1f27;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile video.novid{opacity:0}
.tile .big{width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600}
.tile .lbl{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px;font-size:12px;z-index:1}
.tile.local{position:absolute;right:14px;bottom:96px;width:min(200px,38vw);height:calc(min(200px,38vw) * 9 / 16);z-index:2;border:2px solid rgba(255,255,255,.3)}
.tile.local video{transform:scaleX(-1)}
.tile.local .big{width:40px;height:40px;font-size:18px}
#callBar{display:flex;gap:14px;justify-content:center;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.cbtn{width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
.cbtn.off{background:#fff;color:#000}
.cbtn.end{background:#dc2626;width:auto;border-radius:28px;padding:0 22px;font-size:16px}

/* screen sharing */
#callGrid{overflow:auto}
.tile.screen{grid-column:1/-1;min-height:55vh;background:#000}
.tile.screen video{object-fit:contain}
.tile .fsb{position:absolute;right:10px;bottom:8px;z-index:1;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;padding:2px 8px}
#shareBar{display:flex;align-items:center;justify-content:center;gap:10px;background:#16a34a;color:#fff;padding:6px 12px;font-size:13px}
#outroBar{margin:6px 14px 0;padding:8px 12px;border-radius:10px;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;text-align:center;font-size:14px;font-weight:600;animation:outroPulse 1.2s ease-in-out infinite}
@keyframes outroPulse{0%,100%{opacity:1}50%{opacity:.75}}
.cbtn.sharing{background:#16a34a}

/* in-call chat */
.cbtn{position:relative}
.cbtn .badge{position:absolute;top:-2px;right:-2px;background:#dc2626;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 4px;font-weight:600}
#callChat{position:fixed;right:14px;top:70px;width:min(320px,92vw);height:min(360px,50vh);z-index:6;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.5);overflow:hidden}
#ccHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);cursor:grab;touch-action:none;user-select:none}
#ccHead button{background:none;border:0;color:var(--muted);font-size:16px;padding:0 4px}
#ccMsgs{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.ccm{max-width:85%;padding:5px 9px;border-radius:10px;background:var(--other);align-self:flex-start;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.ccm.me{background:var(--me);color:var(--me-text);align-self:flex-end}
.ccm .n{font-size:11px;font-weight:600;color:var(--accent);display:block}
#ccForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);align-items:flex-end}
#ccForm textarea{flex:1;width:auto;resize:none;max-height:80px;min-height:34px;padding:6px 10px}

/* staged files + voice */
#pending{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;flex:none;max-width:300px}
.chip img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.chip audio{height:34px;width:200px}
.chip .nm2{min-width:0;font-size:12px}
.chip .nm2 b{display:block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .x{background:none;border:0;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
#recBar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--danger)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#mic.rec{background:var(--danger);color:#fff;border-color:var(--danger)}
.msg audio{width:260px;max-width:100%;display:block;margin-bottom:4px}

/* image viewer */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;overflow:auto;padding:64px 12px 12px}
#lbImg{margin:auto;max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;cursor:zoom-in}
#lbImg.zoomed{max-width:none;max-height:none;cursor:zoom-out}
.lbBar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:rgba(0,0,0,.65);color:#fff;z-index:31}
.lbBar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbBar a.btn{text-decoration:none}

/* picture maker */
.mkrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);padding:0}
.emo{font-size:20px;background:none;border:0;padding:2px 4px;line-height:1}
#mkCv{width:100%;max-width:300px;display:block;margin:0 auto 8px;border-radius:12px;touch-action:none;background:#000;cursor:grab}
#mkLayer{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
#mkLayer .lbl2{font-size:12px;color:var(--muted);margin-top:8px}
#mkLayer input[type=range]{width:100%}

#soundHint{padding:7px 14px;font-size:12px;background:var(--bg);color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer}
/* admin + bans */
input[type=number]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
input[type=number]:focus{border-color:var(--accent)}
#banBar{padding:9px 14px;font-size:13px;line-height:1.45;background:rgba(220,38,38,.14);color:var(--danger);border-top:1px solid rgba(220,38,38,.35)}
#banBar.ok{background:rgba(22,163,74,.15);color:#16a34a;border-top-color:rgba(22,163,74,.35)}
#banOverlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}
#banCard{background:var(--panel);border:2px solid var(--danger);border-radius:16px;padding:26px 22px;max-width:380px;width:100%;text-align:center}
#banCard .big{font-size:46px;line-height:1}
#banCard h2{margin:10px 0 6px;color:var(--danger)}
#banCard .rs{margin:12px 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:14px;word-break:break-word}
#banCard .tl{font-size:28px;font-weight:700;margin:10px 0 2px;font-variant-numeric:tabular-nums}
#banCard small{color:var(--muted);display:block;margin-bottom:16px}
#composer.locked{opacity:.55}
.adm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.adm-row .t{flex:1;min-width:0}
.adm-row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-row .t span{color:var(--muted);font-size:13px}
.adm-row .t span.bn{color:var(--danger);font-weight:600}
#modal .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#modal .chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px}
#modal .chips button:hover{border-color:var(--accent)}
.durrow{display:flex;gap:8px;margin-bottom:6px}
/* replies + reactions */
.msg{cursor:pointer}
.msg.flash{animation:flash 1.4s}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.msg .quote{border-left:3px solid var(--accent);background:rgba(0,0,0,.07);border-radius:6px;padding:4px 8px;margin-bottom:5px;font-size:13px;max-width:100%}
.msg .quote b{display:block;font-size:12px;color:var(--accent)}
.msg .quote span{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.me .quote{background:rgba(255,255,255,.18);border-left-color:#fff}
.msg.me .quote b{color:#fff}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rx{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;background:rgba(0,0,0,.1);border-radius:999px;padding:1px 8px;font-size:14px;line-height:1.5}
.rx small{font-size:12px}
.rx.mine{border-color:var(--accent)}
.msg.me .rx{background:rgba(255,255,255,.2)}
.msg.me .rx.mine{border-color:#fff}
#msgMenu{position:fixed;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column;gap:6px;max-width:min(320px,94vw)}
#msgMenu .er{display:flex;gap:2px;flex-wrap:wrap}
#msgMenu .er button{background:none;border:0;font-size:22px;padding:4px 6px;border-radius:8px;line-height:1}
#msgMenu .er button:hover,#msgMenu .er button.sel{background:var(--bg)}
#msgMenu .ac{display:flex;gap:6px}
#replyBar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line)}
#replyBar .rb{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px}
#replyBar .rb b{display:block;font-size:12px;color:var(--accent)}
#replyBar .rb span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#replyBar .x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}

/* modal */
#modView{position:fixed;inset:0;z-index:19;background:var(--bg);display:flex;flex-direction:column}
#modView.hidden{display:none}
#modView .mvHead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#modView .mvHead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modView .mvBody{flex:1;overflow-y:auto;padding:12px 14px;max-width:760px;width:100%;margin:0 auto}
#modView .mvNote{color:var(--muted);font-size:13px;margin-bottom:10px}
#modView .mvRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);cursor:pointer}
#modView .mvRow:hover{border-color:var(--accent)}
#modView .mvRow .nm{font-weight:600}
#modView .mvRow small{color:var(--muted)}
#modView .mvMsg{padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
#modView .mvMsg .who{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center}
#modView .mvMsg .who span{flex:1}
#modView .mvMsg img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-top:6px}
#modView .mvMsg .tx{white-space:pre-wrap;word-break:break-word}
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;border:1px solid var(--line)}
#modal h3{margin:0 0 12px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk input{width:auto}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #main{display:none}
  #app.show-chat #side{display:none}
  #app.show-chat #main{display:flex}
  #back{display:inline-block}
  .msg{max-width:88%}
}
</style>
</head>
<body>

<!-- ======= AUTH ======= -->
<div id="auth" class="hidden">
  <div class="card">
    <h1>Chatterbox</h1>
    <p class="sub" id="authSub">Sign in to start chatting</p>
    <form id="authForm">
      <div id="suFields" class="hidden">
        <label for="username">Username (letters, numbers, _ — 3 to 20)</label>

// Turn a word into a regex that allows repeated letters and simple masks.
// "damn" → /d+a+m+n+/i  matches "daamn", "daaaammmnnn", etc.
function wordToFlexRegex(w) {
  const chars = w.toLowerCase().split('');
  let pat = '';
  for (const ch of chars) {
    if (ch === '*' || ch === '_') pat += '[*_.\\-@#$%!]';   // a mask character must really be there
    else if (/[a-z0-9]/.test(ch)) pat += ch + '+';
    else pat += '\\' + ch;
  }
  return pat;
}
const BAD_FLEX_RE = new RegExp(
  '(?:^|[^a-z0-9])(' + BAD_WORDS.map(wordToFlexRegex).join('|') + ')(?=[^a-z0-9]|$)', 'i'
);

function containsBadWords(text) {
  if (!text) return false;
  const raw = String(text);
  if (BAD_FLEX_RE.test(raw)) return true;
  // strip spaces + mask chars so "f u c k", "f.ck", "d a a m n" are caught
  const stripped = raw.replace(/[\s.*_\-]/g, '');
  if (BAD_FLEX_RE.test(stripped)) return true;
  // collapsed-letter safety net
  const collapsed = stripped.replace(/(.)\1+/gi, '$1');
  if (collapsed.length >= 2 && BAD_FLEX_RE.test(collapsed)) return true;
  return false;
}

function cleanOrBlock(text) {
  if (containsBadWords(text)) {

}

async function loadContacts() {

async function loadConvs() {
  const { data: mem } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
  const ids = (mem || []).map(m => m.conversation_id);
  if (!ids.length) { convs = []; return; }
  const { data } = await sb.from('conversations')
    .select('*, conversation_members(user_id, profiles(id,username,display_name,avatar_url))')
    .in('id', ids).order('last_message_at', { ascending: false });
  convs = data || [];
  convs.forEach(c => c.conversation_members.forEach(m => { if (m.profiles) profiles[m.profiles.id] = m.profiles; }));
}

function fmtLastSeen(ts) {
  if (!ts) return 'offline';
  const t = new Date(ts).getTime();
  if (!t || isNaN(t)) return 'offline';
  const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (sec < 45) return 'last seen just now';
  if (sec < 3600) {
    const m = Math.floor(sec / 60);
    return 'last seen ' + m + (m === 1 ? ' min ago' : ' mins ago');
  }
  if (sec < 86400) {
    const h = Math.floor(sec / 3600);
    return 'last seen ' + h + (h === 1 ? ' hour ago' : ' hours ago');
  }
  if (sec < 86400 * 7) {
    const d = Math.floor(sec / 86400);
    return 'last seen ' + d + (d === 1 ? ' day ago' : ' days ago');
  }
  return 'last seen ' + new Date(ts).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
}

function convSub(c) {

  const last = o.profiles.last_seen || profiles[o.user_id]?.last_seen;
  return handle + ' · ' + fmtLastSeen(last);
}

  applyBanState(false);            // update composer lock + ban bar for own/other ban
  $('#chTitle').textContent = convTitle(c);
  $('#chSub').textContent = convSub(c);
  setAv($('#chAv'), convAvatar(c), convTitle(c));
  $('#chAv').dataset.uid = otherId || '';
  refreshOnline();
  showChat(true);
  render();
  $('#msgs').innerHTML = ''; lastDay = ''; msgCache = {}; reacts = {};
  let { data, error: qerr } = await sb.from('messages').select('*, message_reactions(user_id,emoji)').eq('conversation_id', id).order('created_at', { ascending: false }).limit(150);
  // if reactions-setup.sql hasn't been run yet, fall back to plain messages so chat still works
  if (qerr) ({ data } = await sb.from('messages').select('*').eq('conversation_id', id).order('created_at', { ascending: false }).limit(150));   // newest 150...
  if (activeId !== id) return;
  for (const m of (data || []).reverse()) await appendMsg(m, false);          // ...shown oldest-first
  scrollDown();
}

function scrollDown() { const m = $('#msgs'); m.scrollTop = m.scrollHeight; }

async function appendMsg(m, scroll = true) {
  if (document.querySelector(`[data-mid="${m.id}"]`)) return;
  msgCache[m.id] = m;
  const box = $('#msgs');
  const day = fmtDay(m.created_at);
  if (day !== lastDay) { lastDay = day; box.insertAdjacentHTML('beforeend', `<div class="daysep">${esc(day)}</div>`); }
  const mine = m.sender_id === me.id;
  const c = getConv(m.conversation_id);
  let name = '';
  if (!mine && c?.is_group) name = `<div class="nm">${esc((await nameOf(m.sender_id)).display_name)}</div>`;
  let file = '';
  if (m.file_path) {
    const isImg = (m.file_type || '').startsWith('image/');
    const isAud = (m.file_type || '').startsWith('audio/');
    file = isAud
      ? `<button class="btn ghost small play-voice" data-path="${esc(m.file_path)}" type="button">🎤 Play voice message${m.file_size ? ' · ' + fmtSize(m.file_size) : ''}</button>`
      : isImg
      ? `<img data-path="${esc(m.file_path)}" data-name="${esc(m.file_name)}" alt="${esc(m.file_name)}" style="cursor:zoom-in">`
      : `<a class="file" data-path="${esc(m.file_path)}" data-dl="${esc(m.file_name)}" href="#">📎 <span>${esc(m.file_name)}<br><small>${fmtSize(m.file_size || 0)}</small></span></a>`;
  }
  let quote = '';
  if (m.reply_to) {
    const q = await quoteInfo(m.reply_to);
    if (q) {
      const qn = q.sender_id === me.id ? 'You' : (await nameOf(q.sender_id)).display_name;
      quote = `<div class="quote" data-q="${esc(q.id)}"><b>${esc(qn)}</b><span>${esc(msgSnippet(q))}</span></div>`;
    }
  }
  const delBtn = mine ? `<button class="del-msg" title="Delete your message" data-mid="${m.id}">🗑️</button>` : '';
  const div = document.createElement('div');
  div.className = 'msg' + (mine ? ' me' : '');
  div.dataset.mid = m.id;
  div.innerHTML = `${name}${quote}${file}${m.body ? `<div class="tx">${esc(m.body)}</div>` : ''}<div class="reacts hidden"></div><div class="tm">${fmtTime(m.created_at)}${delBtn}</div>`;
  box.appendChild(div);
  if (Array.isArray(m.message_reactions)) reacts[m.id] = m.message_reactions.map(r => ({ user_id: r.user_id, emoji: r.emoji }));
  else if (!reacts[m.id]) reacts[m.id] = [];
  renderReacts(m.id);
  if (mine) {
    const btn = div.querySelector('.del-msg');
    if (btn) btn.onclick = (e) => { e.stopPropagation(); deleteOwnMessage(m.id, m.file_path); };
  }
  // Images + normal files: load signed URL now. Voice notes: only when the user presses Play.
  div.querySelectorAll('[data-path]').forEach(async el => {
    if (el.classList.contains('play-voice')) return;   // handled on click
    const dl = el.dataset.dl ? { download: el.dataset.dl } : undefined;
    const { data } = await sb.storage.from(BUCKET).createSignedUrl(el.dataset.path, 3600, dl);
    if (!data) return;
    if (el.tagName === 'IMG') { el.src = data.signedUrl; el.onclick = () => openLightbox(data.signedUrl, el.dataset.path, el.dataset.name); el.onload = () => { if (scroll) scrollDown(); }; }
    else el.href = data.signedUrl;
  });
  div.querySelectorAll('.play-voice').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      if (btn.dataset.loading) return;
      btn.dataset.loading = '1';
      btn.disabled = true;
      btn.textContent = 'Loading…';
      try {
        const { data } = await sb.storage.from(BUCKET).createSignedUrl(btn.dataset.path, 3600);
        if (!data?.signedUrl) throw new Error('Could not load audio');
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'auto';
        audio.src = data.signedUrl;
        audio.style.width = '260px';
        audio.style.maxWidth = '100%';
        audio.style.display = 'block';
        audio.style.marginBottom = '4px';
        btn.replaceWith(audio);
        audio.play().catch(() => {});
        if (scroll) scrollDown();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '🎤 Play voice message';
        delete btn.dataset.loading;
        alert('Could not load the voice message.');
      }
    };
  });
  if (scroll) scrollDown();
}

async function deleteOwnMessage(id, filePath) {
  if (!confirm('Delete this message? It will be removed for everyone.')) return;
  const { error } = await sb.from('messages').delete().eq('id', id).eq('sender_id', me.id);
  if (error) return alert('Could not delete: ' + error.message + '\n\nMake sure your Supabase RLS policy allows deleting your own messages.');
  // remove from UI immediately
  document.querySelectorAll(`[data-mid="${id}"]`).forEach(el => el.remove());
  // optionally remove the file from storage
  if (filePath) {
    try { await sb.storage.from(BUCKET).remove([filePath]); } catch (_) {}
  }
  // also remove from in-call chat if present
  document.querySelectorAll(`#ccMsgs [data-id="${id}"]`).forEach(el => el.remove());
}

let pending = [];   // staged files: { file, url }
let sending = false;

function addPending(file) {
  if (file.size > MAX_FILE_MB * 1048576) return alert(`${file.name} is over ${MAX_FILE_MB} MB.`);
  pending.push({ file, url: URL.createObjectURL(file) });
  renderPending();
}
function removePending(item) {
  URL.revokeObjectURL(item.url);
  pending = pending.filter(p => p !== item);
  renderPending();
}
function clearPending() { pending.forEach(p => URL.revokeObjectURL(p.url)); pending = []; renderPending(); }

function renderPending() {
  const el = $('#pending');
  el.classList.toggle('hidden', !pending.length);
  $('#text').placeholder = (banActive() || otherBanActive())
    ? (banActive() ? 'You are banned from sending messages' : 'This person is banned — you can’t message them')
    : pending.length ? 'Add a message (optional)…' : 'Type a message…';
  el.innerHTML = '';
  pending.forEach(p => {
    const t = p.file.type || '';
    const chip = document.createElement('div'); chip.className = 'chip';
    const preview = t.startsWith('image/') ? `<img src="${p.url}" alt="">`
      : t.startsWith('audio/') ? `<audio controls src="${p.url}"></audio>`
      : '<span style="font-size:24px">📎</span>';
    const label = t.startsWith('audio/') ? '' : `<div class="nm2"><b>${esc(p.file.name)}</b><span style="color:var(--muted)">${fmtSize(p.file.size)}</span></div>`;
    chip.innerHTML = `${preview}${label}<button class="x" title="Remove">×</button>`;
    chip.querySelector('.x').onclick = () => removePending(p);
    el.appendChild(chip);
  });
}

async function sendText() {
  if (sending || !activeId) return;
  if (banGuard()) return;
  const t = $('#text'); let body = t.value.trim();
  if (!body && !pending.length) return;
  // Block swear / cuss words
  if (body) {
    body = cleanOrBlock(body);
    if (body === null) return;
  }
  if (!spamOk(body)) return;
  const cid = activeId;
  let repId = replyTo ? replyTo.id : null;
  sending = true; $('#send').disabled = true;
  try {
    if (!pending.length) {
      t.value = ''; t.style.height = 'auto';
      const { data, error } = await sb.from('messages').insert({ conversation_id: cid, sender_id: me.id, body, ...(repId ? { reply_to: repId } : {}) }).select().single();
      if (error) { t.value = body; return sendErr(error); }
      clearReply();
      if (activeId === cid) appendMsg(data);
    } else {
      const st = $('#upStatus'); st.classList.remove('hidden');
      const items = pending.slice();
      let caption = body;      // the message goes with the first file
      for (let i = 0; i < items.length; i++) {
        const it = items[i], f = it.file;
        st.textContent = `Uploading ${f.name} (${i + 1}/${items.length})…`;
        const safe = f.name.replace(/[^\w.\-]+/g, '_');
        const path = `${cid}/${crypto.randomUUID()}-${safe}`;
        const up = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || 'application/octet-stream' });
        if (up.error) { alert('Upload failed: ' + up.error.message); break; }
        const { data, error } = await sb.from('messages').insert({
          conversation_id: cid, sender_id: me.id, body: caption,
          file_path: path, file_name: f.name, file_type: f.type, file_size: f.size,
          ...(repId ? { reply_to: repId } : {})
        }).select().single();
        if (error) { sendErr(error); break; }
        if (repId) { repId = null; clearReply(); }
        if (caption) { t.value = ''; t.style.height = 'auto'; caption = ''; }
        removePending(it);
        if (activeId === cid) appendMsg(data);
      }
      st.classList.add('hidden');
    }
  } finally { sending = false; $('#send').disabled = banActive() || otherBanActive(); checkLimit(); }
  bumpConv(cid);
}
$('#send').onclick = sendText;
$('#text').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  else if (e.key === 'Enter' && lineCount(e.target.value) >= MAX_LINES) { e.preventDefault(); checkLimit(true); }
};
$('#text').oninput = e => {
  const t = e.target, clamped = clampText(t.value), trimmed = clamped !== t.value;
  if (trimmed) t.value = clamped;
  t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 230) + 'px';
  checkLimit(trimmed);
};

$('#attach').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => {
  [...e.target.files].forEach(addPending);
  e.target.value = '';
  $('#text').focus();
};

/* ---------------- VOICE MESSAGES ---------------- */
let rec = null, recChunks = [], recTimer = null, recCancel = false;

function pickMime() {
  if (!window.MediaRecorder) return '';
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'])
    if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}
function stopRec(cancel) { if (!rec) return; recCancel = cancel; rec.stop(); }

$('#recCancel').onclick = () => stopRec(true);
$('#mic').onclick = async () => {
  if (rec) return stopRec(false);
  if (!activeId) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder)
    return alert('Voice messages need a browser that supports recording and a secure (https) page.');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return alert('Microphone access was blocked. Allow it in your browser (the icon next to the address bar) and try again.'); }
  const mime = pickMime();
  const r = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  rec = r; recChunks = []; recCancel = false;
  r.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  r.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(recTimer);
    $('#recBar').classList.add('hidden');
    $('#mic').textContent = '🎤'; $('#mic').classList.remove('rec');
    const type = (r.mimeType || mime || 'audio/webm').split(';')[0];
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    const blob = new Blob(recChunks, { type });
    rec = null;
    if (!recCancel && blob.size > 0) addPending(new File([blob], `voice-message.${ext}`, { type }));
  };
  r.start();
  const t0 = Date.now();
  $('#recTime').textContent = '0:00';
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('#recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 250);
  $('#recBar').classList.remove('hidden');
  $('#mic').textContent = '⏹'; $('#mic').classList.add('rec');
};

async function bumpConv(id) { await loadConvs(); if (tab === 'chats') renderChats(); }

/* ---------------- REALTIME ---------------- */
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('chat-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async p => {
      const m = p.new;
      if (m.sender_id === me.id && m.conversation_id === activeId) return;
      if (m.sender_id !== me.id) notifyIncoming(m);
      if (!getConv(m.conversation_id)) await loadConvs();
      if (call && m.conversation_id === call.convId) callChatAdd(m);
      if (m.conversation_id === activeId) appendMsg(m);
      else if (m.sender_id !== me.id) unread.add(m.conversation_id);
      await loadConvs(); if (tab === 'chats') renderChats();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => {
      const id = p.old?.id;
      if (!id) return;
      document.querySelectorAll(`[data-mid="${id}"]`).forEach(el => el.remove());
      document.querySelectorAll(`#ccMsgs [data-id="${id}"]`).forEach(el => el.remove());
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conversation_members', filter: 'user_id=eq.' + me.id }, async () => {
      await loadConvs(); if (tab === 'chats') renderChats();
    })
    .subscribe();

  // reactions use their own channel so a missing table can never break chat itself
  if (reactCh) sb.removeChannel(reactCh);
  reactCh = sb.channel('react-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message_reactions' }, p => applyReaction(true, p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'message_reactions' }, p => applyReaction(false, p.old))
    .subscribe();
}

/* ================================================================
   REPLIES + REACTIONS
   Needs reactions-setup.sql to have been run once in Supabase.
   Click / tap a message to open the menu (reactions, reply, copy).
   ================================================================ */
const QUICK_REACTS = ['❤️', '👍', '😂', '😮', '😢', '🙏'];
const MORE_REACTS = ['🔥', '🎉', '👏', '😍', '🤔', '😡', '💯', '👀', '🥳', '😭', '🤣', '👎', '✅', '❌', '🤝', '💀'];

function msgSnippet(m) {
  if (m.body) return m.body.replace(/\s+/g, ' ').slice(0, 100);
  const t = m.file_type || '';
  if (t.startsWith('audio/')) return '🎤 Voice message';
  if (t.startsWith('image/')) return '🖼️ Photo';
  if (m.file_name) return '📎 ' + m.file_name;
  return 'Message';
}

async function quoteInfo(id) {
  if (msgCache[id]) return msgCache[id];
  const { data } = await sb.from('messages').select('id,sender_id,body,file_name,file_type').eq('id', id).maybeSingle();
  if (data) msgCache[id] = data;
  return data;
}

function jumpTo(id) {
  const t = document.querySelector('.msg[data-mid="' + id + '"]');
  if (!t) return alert('That message is older than the ones loaded in this chat.');
  t.scrollIntoView({ block: 'center', behavior: 'smooth' });
  t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  setTimeout(() => t.classList.remove('flash'), 1500);
}

/* ---- reply bar ---- */
async function setReply(m) {
  replyTo = m;
  const who = m.sender_id === me.id ? 'yourself' : (await nameOf(m.sender_id)).display_name;
  if (replyTo !== m) return;
  $('#rbName').textContent = 'Replying to ' + who;
  $('#rbText').textContent = msgSnippet(m);
  $('#replyBar').classList.remove('hidden');
  $('#text').focus();
}
function clearReply() { replyTo = null; $('#replyBar').classList.add('hidden'); }
$('#rbX').onclick = clearReply;

/* ---- reactions ---- */
function renderReacts(mid) {
  const div = document.querySelector('.msg[data-mid="' + mid + '"]');
  if (!div) return;
  const box = div.querySelector('.reacts'); if (!box) return;
  const list = reacts[mid] || [];
  const groups = {};
  list.forEach(r => { (groups[r.emoji] = groups[r.emoji] || []).push(r.user_id); });
  box.innerHTML = '';
  box.classList.toggle('hidden', !list.length);
  Object.entries(groups).forEach(([emoji, users]) => {
    const b = document.createElement('button');
    b.className = 'rx' + (users.includes(me.id) ? ' mine' : '');
    b.title = users.map(u => u === me.id ? 'You' : nameFor(u)).join(', ');
    b.innerHTML = esc(emoji) + (users.length > 1 ? ' <small>' + users.length + '</small>' : '');
    b.onclick = ev => { ev.stopPropagation(); toggleReaction(mid, emoji); };
    box.appendChild(b);
  });
}

async function toggleReaction(mid, emoji) {
  const list = reacts[mid] = reacts[mid] || [];
  const i = list.findIndex(r => r.user_id === me.id && r.emoji === emoji);
  if (i >= 0) {
    list.splice(i, 1); renderReacts(mid);
    const { error } = await sb.from('message_reactions').delete().eq('message_id', mid).eq('user_id', me.id).eq('emoji', emoji);
    if (error) { list.push({ user_id: me.id, emoji }); renderReacts(mid); alert('Could not remove the reaction: ' + error.message); }
  } else {
    if (banGuard()) return;
    list.push({ user_id: me.id, emoji }); renderReacts(mid);
    const { error } = await sb.from('message_reactions').insert({ message_id: mid, user_id: me.id, emoji });
    if (error) {
      const j = list.findIndex(r => r.user_id === me.id && r.emoji === emoji);
      if (j >= 0) list.splice(j, 1);
      renderReacts(mid);
      if (/banned/i.test(error.message)) { loadMyBan(true).then(banGuard); }
      else alert('Could not react: ' + error.message + '\n\nHave you run reactions-setup.sql in Supabase?');
    }
  }
}

function applyReaction(add, row) {
  if (!row || !row.message_id) return;
  if (!document.querySelector('.msg[data-mid="' + row.message_id + '"]')) return;   // not on screen
  const list = reacts[row.message_id] = reacts[row.message_id] || [];
  const i = list.findIndex(r => r.user_id === row.user_id && r.emoji === row.emoji);
  if (add && i < 0) list.push({ user_id: row.user_id, emoji: row.emoji });
  if (!add && i >= 0) list.splice(i, 1);
  renderReacts(row.message_id);
}

/* ---- the little menu that pops up when you click a message ---- */
function closeMsgMenu() {
  document.getElementById('msgMenu')?.remove();
  msgMenuFor = null;
}
function placeMenu(menu, div) {
  const r = div.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  let top = r.top - mh - 6;
  if (top < 8) top = r.bottom + 6;
  if (top + mh > innerHeight - 8) top = Math.max(8, innerHeight - mh - 8);
  let left = div.classList.contains('me') ? r.right - mw : r.left;
  left = Math.min(Math.max(8, left), Math.max(8, innerWidth - mw - 8));
  menu.style.top = top + 'px'; menu.style.left = left + 'px';
}
function openMsgMenu(div) {
  closeMsgMenu();
  const mid = div.dataset.mid, m = msgCache[mid];
  if (!m) return;
  msgMenuFor = mid;
  const mineSet = new Set((reacts[mid] || []).filter(r => r.user_id === me.id).map(r => r.emoji));
  const btn = e => `<button data-e="${e}" class="${mineSet.has(e) ? 'sel' : ''}">${e}</button>`;
  const menu = document.createElement('div');
  menu.id = 'msgMenu';
  menu.innerHTML = `<div class="er">${QUICK_REACTS.map(btn).join('')}<button data-more="1" title="More reactions">➕</button></div>
    <div class="ac"><button class="btn ghost small" data-act="reply">↩ Reply</button>${m.body ? '<button class="btn ghost small" data-act="copy">Copy</button>' : ''}${isAdmin && m.sender_id !== me.id ? '<button class="btn danger small" data-act="ban">🔨 Ban</button>' : ''}</div>`;
  document.body.appendChild(menu);
  placeMenu(menu, div);
  menu.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    if (b.dataset.e) { closeMsgMenu(); toggleReaction(mid, b.dataset.e); }
    else if (b.dataset.more) {
      b.remove();
      menu.querySelector('.er').insertAdjacentHTML('beforeend', MORE_REACTS.map(btn).join(''));
      placeMenu(menu, div);
    }
    else if (b.dataset.act === 'reply') { closeMsgMenu(); setReply(m); }
    else if (b.dataset.act === 'ban') { closeMsgMenu(); openBanForm(m.sender_id, false); }
    else if (b.dataset.act === 'copy') {
      try { await navigator.clipboard.writeText(m.body); } catch { alert('Couldn’t copy automatically. Select the text and copy it by hand.'); }
      closeMsgMenu();
    }
  };
}

$('#msgs').addEventListener('click', e => {
  const div = e.target.closest('.msg'); if (!div) return;
  const q = e.target.closest('.quote');
  if (q) { closeMsgMenu(); jumpTo(q.dataset.q); return; }
  if (e.target.closest('a,img,audio,button')) { closeMsgMenu(); return; }   // links, photos, players, buttons do their own thing
  if (String(window.getSelection()).length) return;                          // they're selecting text, don't interrupt
  if (msgMenuFor === div.dataset.mid) return closeMsgMenu();
  openMsgMenu(div);
});
$('#msgs').addEventListener('scroll', closeMsgMenu);
window.addEventListener('resize', closeMsgMenu);
document.addEventListener('click', e => {
  if (msgMenuFor && !e.target.closest('#msgMenu') && !e.target.closest('#msgs .msg')) closeMsgMenu();
});

/* ================================================================
   ANTI-SPAM  (the database enforces it too: see spam-limit.sql)
   ================================================================ */
const SPAM_MAX = 5;            // messages allowed...
const SPAM_WINDOW = 10000;     // ...in this many milliseconds
const DUP_WINDOW = 20000;      // same text twice within this long is blocked
let sendTimes = [], lastSent = { body: '', at: 0 };

function spamOk(body, inCall) {
  const now = Date.now();
  sendTimes = sendTimes.filter(t => now - t < SPAM_WINDOW);
  let why = '';
  if (sendTimes.length >= SPAM_MAX) {
    const wait = Math.max(1, Math.ceil((SPAM_WINDOW - (now - sendTimes[0])) / 1000));
    why = 'Slow down! You can send again in ' + wait + 's.';
  } else if (body && body === lastSent.body && now - lastSent.at < DUP_WINDOW) {
    why = 'You just sent that. Wait a bit before repeating it.';
  }
  if (why) {
    if (inCall) {
      const ta = $('#ccText'), old = ta.dataset.ph || ta.placeholder;
      ta.dataset.ph = old; ta.placeholder = why;
      setTimeout(() => { ta.placeholder = old; }, 2500);
    } else {
      limitNote(why, true);
      clearTimeout(limitTimer);
      limitTimer = setTimeout(() => checkLimit(false), 3000);
    }
    return false;
  }
  sendTimes.push(now);
  if (body) lastSent = { body, at: now };
  return true;
}

   NEW-MESSAGE DING + tab title count
   ================================================================ */
const BASE_TITLE = document.title;
let soundOn = true, lastDing = 0, unseen = 0;
try { soundOn = localStorage.getItem('chatterbox-sound') !== 'off'; } catch {}

function paintSound() {
  const b = $('#soundBtn'); if (!b) return;
  b.textContent = soundOn ? '🔔' : '🔕';
  b.title = soundOn ? 'Message sound is on (click to mute)' : 'Message sound is off (click to turn on)';
}

$('#soundBtn').onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem('chatterbox-sound', soundOn ? 'on' : 'off'); } catch {}
  paintSound();
  if (soundOn) { lastDing = 0; playDing(); }   // little preview so you know it works
};

function playDing() {
  if (!soundOn || !ac) return;
  const now = Date.now();
  if (now - lastDing < 1500) return;           // a flood of messages = one ding, not machine-gun noise
  lastDing = now;
  try {
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    [[880, 0], [1318.5, 0.09]].forEach(([freq, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.5);
      o.start(t0 + d); o.stop(t0 + d + 0.55);
    });
  } catch {}
}

function notifyIncoming(m) {
  const away = document.hidden || !document.hasFocus();
  const watching = !away && m.conversation_id === activeId;
  console.log('[Chatterbox] message from someone else — sound on:', soundOn, '| audio:', ac ? ac.state : 'not unlocked (click the page once)', '| tab away:', away, '| watching this chat:', watching);
  if (watching) return;                         // you're looking right at it
  playDing();
  if (away) { unseen++; document.title = '(' + unseen + ') ' + BASE_TITLE; }
}
function resetTitle() { unseen = 0; document.title = BASE_TITLE; }
window.addEventListener('focus', resetTitle);
document.addEventListener('visibilitychange', () => { if (!document.hidden) resetTitle(); });

/* ================================================================
   ADMIN + BANS
   Needs admin-bans.sql to have been run once in Supabase.
   Exactly one account (set in that SQL file) is the admin.
   A banned person can still read, but can't send messages or react.
   The database enforces it; this code just shows the screens.
   ================================================================ */
let isAdmin = false, myBan = null, banTick = null, banPoll = null, banCh = null, banShownFor = '';
let currentOtherBan = null;          // ban info of the other person in the open DM (null for groups / no ban)
let otherBanCache = {};              // uid -> { ban, fetchedAt }
const BAN_LOCKED = ['#text', '#send', '#attach', '#mic', '#ccText', '#ccSend'];

function fmtLeft(ms) {
  let s = Math.max(0, Math.ceil(ms / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm ' + String(s).padStart(2, '0') + 's';
  return s + 's';
}
const banLeftMs = () => !myBan ? 0 : myBan.permanent ? Infinity : myBan.endsAt - Date.now();
const banActive = () => banLeftMs() > 0;
const banLeftText = () => myBan?.permanent ? 'Permanent' : fmtLeft(banLeftMs());

const otherBanLeftMs = () => !currentOtherBan ? 0 : currentOtherBan.permanent ? Infinity : currentOtherBan.endsAt - Date.now();
const otherBanActive = () => otherBanLeftMs() > 0;
/** Exact Melbourne time when the other person's ban ends (or permanent text). */
function otherBanEndText() {
  if (!currentOtherBan) return '';
  if (currentOtherBan.permanent) return 'the ban is lifted by an admin';
  try {
    return new Date(currentOtherBan.endsAt).toLocaleString('en-AU', {
      timeZone: 'Australia/Melbourne',
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });
  } catch {
    return fmtLeft(otherBanLeftMs());
  }
}

/** Fetch ban status for any user. Requires the get_user_ban RPC (see SQL below). */
async function getUserBan(uid) {
  if (!uid || uid === me?.id) return null;
  const cached = otherBanCache[uid];
  if (cached && Date.now() - cached.fetchedAt < 30000) return cached.ban;
  try {
    const { data, error } = await sb.rpc('get_user_ban', { p_user: uid });
    if (error) {
      // RPC missing or RLS issue — fail soft so chat still works
      if (!getUserBan._warned) {
        getUserBan._warned = true;
        console.warn('[Chatterbox] get_user_ban failed. Run the get_user_ban SQL in Supabase:', error.message);
      }
      return null;
    }
    const r = Array.isArray(data) ? data[0] : data;
    const ban = r ? {
      reason: r.ban_reason || r.reason || '',
      permanent: !!r.permanent,
      endsAt: Date.now() + (Number(r.seconds_left) || 0) * 1000,
      id: String(r.ban_id || '')
    } : null;
    otherBanCache[uid] = { ban, fetchedAt: Date.now() };
    return ban;
  } catch (e) {
    console.warn('[Chatterbox] getUserBan error', e);
    return null;
  }
}

async function loadMyBan(notify) {
  if (!me) return;
  const uid = me.id;
  const { data, error } = await sb.rpc('my_ban');
  if (!me || me.id !== uid || error) return;            // (no error = admin-bans.sql has been run)
  const r = Array.isArray(data) ? data[0] : data;
  myBan = r ? { reason: r.ban_reason || '', permanent: !!r.permanent, endsAt: Date.now() + (Number(r.seconds_left) || 0) * 1000, id: String(r.ban_id || '') } : null;
  applyBanState(notify);
}

function applyBanState(notify) {
  const ownOn = banActive(), was = document.body.classList.contains('banned');
  const otherOn = otherBanActive();
  const lock = ownOn || otherOn;
  document.body.classList.toggle('banned', ownOn);
  BAN_LOCKED.forEach(sel => { const el = $(sel); if (el) el.disabled = lock || (sel === '#send' && sending); });
  $('#composer').classList.toggle('locked', lock);
  if (ownOn) {
    $('#text').placeholder = 'You are banned from sending messages';
    $('#ccText').placeholder = 'You are banned';
  } else if (otherOn) {
    $('#text').placeholder = 'This person is banned — you can’t message them';
    $('#ccText').placeholder = 'This person is banned';
  } else {
    $('#text').placeholder = pending.length ? 'Add a message (optional)…' : 'Type a message…';
    $('#ccText').placeholder = 'Message…';
  }
  const bar = $('#banBar');
  if (ownOn) {
    bar.className = '';
    bar.innerHTML = '🚫 <b>You are banned from sending messages.</b> ' + (myBan.permanent ? '' : '<span id="banLeft"></span> left. ') + (myBan.reason ? '<br>Reason: ' + esc(myBan.reason) : '');
    tickBan();
    if (!banTick) banTick = setInterval(tickBan, 1000);
    if (notify && banShownFor !== myBan.id) { banShownFor = myBan.id; showBanOverlay(); }
  } else if (otherOn) {
    bar.className = '';
    // Reason is only shown to the banned person themselves (own ban UI). Never show it to others.
    bar.innerHTML = '🚫 <b>This person has been banned so you can no longer message them until ' +
      esc(otherBanEndText()) + '.</b>';
    if (!banTick) banTick = setInterval(tickBan, 1000);
  } else {
    if (banTick) { clearInterval(banTick); banTick = null; }
    if (was) {                                           // the ban just ended (or the admin lifted it)
      bar.className = 'ok'; bar.textContent = '✅ Your ban is over. You can send messages again.';
      setTimeout(() => { if (!banActive() && !otherBanActive()) bar.className = 'hidden'; }, 6000);
      if (!$('#banOverlay').classList.contains('hidden')) paintBanOverlay();
    } else {
      bar.className = 'hidden';
    }
  }
}

function tickBan() {
  if (banActive()) {
    const a = document.getElementById('banLeft'); if (a) a.textContent = banLeftText();
    const b = document.getElementById('banTl'); if (b) b.textContent = banLeftText();
    return;
  }
  if (otherBanActive()) {
    // absolute Melbourne time is static; just wait until the ban expires then refresh
    return;
  }
  // neither ban is active any more
  applyBanState(false);
}

function showBanOverlay() { $('#banOverlay').classList.remove('hidden'); paintBanOverlay(); }
function paintBanOverlay() {
  const on = banActive();
  $('#banCard').innerHTML = on
    ? `<div class="big">🚫</div><h2>You have been banned</h2>
       <div style="color:var(--muted);font-size:14px">You can’t send messages or react${myBan.permanent ? '' : ' for a while'}. You can still read your chats.</div>
       ${myBan.reason ? `<div class="rs"><b>Reason:</b> ${esc(myBan.reason)}</div>` : ''}
       <div class="tl" id="banTl">${esc(banLeftText())}</div>
       <small>${myBan.permanent ? 'until the admin lifts it' : 'time left'}</small>
       <button class="btn" id="banOk">OK</button>`
    : `<div class="big">✅</div><h2 style="color:#16a34a">Your ban is over</h2>
       <small>You can send messages again.</small><button class="btn" id="banOk">OK</button>`;
  $('#banOk').onclick = () => $('#banOverlay').classList.add('hidden');
}

function banGuard() {                                    // true = blocked
  if (banActive()) {
    if ($('#banOverlay').classList.contains('hidden')) showBanOverlay();
    return true;
  }
  if (otherBanActive()) {
    // make sure the bar is visible and up to date
    applyBanState(false);
    return true;
  }
  return false;
}

function sendErr(error) {
  if (/banned/i.test(error?.message || '')) { loadMyBan(true).then(banGuard); return; }
  alert(error?.message || 'Could not send that.');
}

async function startBans() {
  stopBans();
  const uid = me.id;
  sb.from('app_admin').select('user_id').eq('user_id', uid).maybeSingle().then(({ data }) => {
    if (!me || me.id !== uid) return;
    isAdmin = !!data;
    $('#adminBtn').classList.toggle('hidden', !isAdmin);
  });
  banCh = sb.channel('bans-' + uid)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bans' }, async p => {
      const target = (p.new || p.old || {}).user_id;
      if (target === uid) loadMyBan(true);
      // If the person we're chatting with was banned / unbanned, refresh the bar
      if (activeId && target) {
        const c = getConv(activeId);
        const otherId = c && !c.is_group ? dmOther(c) : null;
        if (otherId === target) {
          delete otherBanCache[target];
          currentOtherBan = await getUserBan(otherId);
          applyBanState(false);
        }
      }
    })
    .subscribe();
  banPoll = setInterval(async () => {
    loadMyBan(true);
    // also refresh the open DM's ban status every 20s
    if (activeId) {
      const c = getConv(activeId);
      const otherId = c && !c.is_group ? dmOther(c) : null;
      if (otherId) {
        delete otherBanCache[otherId];
        currentOtherBan = await getUserBan(otherId);
        applyBanState(false);
      }
    }
  }, 20000);
  await loadMyBan(true);
}

function stopBans() {
  if (banCh) { sb.removeChannel(banCh); banCh = null; }
  clearInterval(banPoll); banPoll = null;
  clearInterval(banTick); banTick = null;
  myBan = null; isAdmin = false; banShownFor = ''; closeModView();
  currentOtherBan = null; otherBanCache = {};
  document.body.classList.remove('banned');
  $('#adminBtn').classList.add('hidden');
  $('#banBar').className = 'hidden'; $('#banOverlay').classList.add('hidden');
  BAN_LOCKED.forEach(sel => { const el = $(sel); if (el) el.disabled = false; });
  $('#composer').classList.remove('locked');
}

/* ---- the admin panel (only the admin ever sees the button) ---- */
const DUR_UNITS = [['minutes', 1], ['hours', 60], ['days', 1440], ['weeks', 10080]];
let admUsers = [], admBans = {};

async function loadAdminData() {
  const [u, b] = await Promise.all([
    sb.from('profiles').select('id,username,display_name,avatar_url').order('display_name').limit(1000),
    sb.rpc('admin_list_bans')
  ]);
  admUsers = (u.data || []).filter(x => x.id !== me.id);
  admUsers.forEach(x => { if (!profiles[x.id]) profiles[x.id] = x; });
  admBans = {};
  (b.data || []).forEach(r => { admBans[r.target_id] = { reason: r.reason || '', permanent: !!r.permanent, endsAt: Date.now() + (Number(r.seconds_left) || 0) * 1000 }; });
  return b.error ? b.error.message : '';
}

function paintAdminRows() {
  const q = ($('#admQ').value || '').trim().toLowerCase();
  const list = admUsers
    .filter(u => !q || (u.username || '').toLowerCase().includes(q) || (u.display_name || '').toLowerCase().includes(q))
    .sort((a, b) => (!!admBans[b.id] - !!admBans[a.id]) || (a.display_name || '').localeCompare(b.display_name || ''));
  $('#admList').innerHTML = list.length ? list.map(u => {
    const bn = admBans[u.id];
    return `<div class="adm-row"><div class="av sm" style="${avStyle(u.avatar_url)}">${avInner(u.avatar_url, u.display_name)}</div>
      <div class="t"><b>${esc(u.display_name)}</b><span>@${esc(u.username)}</span>${bn ? `<br><span class="bn">🚫 ${bn.permanent ? 'Banned permanently' : 'Banned · ' + esc(fmtLeft(bn.endsAt - Date.now())) + ' left'}</span>` : ''}</div>
      ${bn ? `<button class="btn ghost small" data-unban="${esc(u.id)}">Unban</button>` : ''}
      <button class="btn danger small" data-ban="${esc(u.id)}">${bn ? 'Change' : 'Ban'}</button></div>`;
  }).join('') : '<div class="empty">No one found.</div>';
}

/* ---- Admin: browse every GROUP chat (even ones you're not in) and delete messages ----
   Text only until you press Preview, so looking around doesn't use bandwidth. DMs are never shown. */
let mvGroup = null;
function mvShell() {
  let v = $('#modView');
  if (!v) { v = document.createElement('div'); v.id = 'modView'; document.body.appendChild(v); }
  v.classList.remove('hidden');
  return v;
}
function closeModView() { const v = $('#modView'); if (v) v.classList.add('hidden'); mvGroup = null; }
async function openModView() {
  if (!isAdmin) return;
  mvGroup = null;
  const v = mvShell();
  v.innerHTML = `<div class="mvHead"><button class="btn ghost small" id="mvClose">✕ Close</button><b>👁️ All group chats</b></div>
    <div class="mvBody"><div class="mvNote">Biggest files first. Group chats only — private 1-to-1 chats can’t be opened. Members are not told you looked.</div><div id="mvList"><div class="empty">Loading…</div></div></div>`;

      <small>${g.member_count} members · ${g.message_count} messages · ${g.file_count} files (${fmtSize(Number(g.file_bytes) || 0)})</small></div><span>›</span></div>`).join('')
    : '<div class="empty">No group chats yet.</div>';
  $('#mvList').onclick = e => { const r = e.target.closest('.mvRow'); if (r) openModGroup(r.dataset.g, r.dataset.n); };

function mvMsgHtml(m) {

      <button class="btn ghost small" data-prev="${esc(m.file_path)}" data-type="${esc(m.file_type || '')}" data-name="${esc(m.file_name || '')}">Preview</button></div><div class="mvPrev"></div>` : '';

async function openModGroup(id, name) {
  mvGroup = { id, name, oldest: null, done: false, busy: false };
  const v = mvShell();
  v.innerHTML = `<div class="mvHead"><button class="btn ghost small" id="mvBack">‹ Back</button><b>${esc(name)}</b><button class="btn ghost small" id="mvClose">✕</button></div>
    <div class="mvBody"><div class="err" id="mvErr"></div><div id="mvMsgs"><div class="empty">Loading…</div></div><button class="btn ghost small hidden" id="mvMore" style="margin:6px 0 14px">Load older</button></div>`;
  $('#mvClose').onclick = closeModView;
  $('#mvBack').onclick = openModView;
  $('#mvMore').onclick = () => loadModMsgs(false);
  $('#mvMsgs').onclick = onModClick;
  await loadModMsgs(true);
}
async function loadModMsgs(first) {
  const g = mvGroup; if (!g || g.busy) return; g.busy = true;
  const { data, error } = await sb.rpc('admin_group_messages', { p_conv: g.id, p_limit: 100, p_before: g.oldest });
  g.busy = false;
  if (mvGroup !== g || !$('#mvMsgs')) return;
  if (error) { $('#mvErr').textContent = error.message; if (first) $('#mvMsgs').innerHTML = ''; return; }
  const rows = data || [];
  if (rows.length) g.oldest = rows[rows.length - 1].created_at;
  g.done = rows.length < 100;
  const need = [...new Set(rows.map(m => m.sender_id))].filter(u => !profiles[u]);
  for (const u of need) { try { await nameOf(u); } catch (_) {} }
  if (first) $('#mvMsgs').innerHTML = '';
  if (first && !rows.length) $('#mvMsgs').innerHTML = '<div class="empty">No messages.</div>';
  $('#mvMsgs').insertAdjacentHTML('beforeend', rows.map(mvMsgHtml).join(''));   // newest first
  $('#mvMore').classList.toggle('hidden', g.done);
}
async function onModClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const box = b.closest('.mvMsg');
  if (b.dataset.prev) {
    b.disabled = true;
    const { data } = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.prev, 600);
    b.disabled = false;
    if (!data?.signedUrl) { $('#mvErr').textContent = 'Could not load that file. (Did you run admin-groups.sql in Supabase?)'; return; }
    const holder = box.querySelector('.mvPrev');
    if ((b.dataset.type || '').startsWith('image/')) holder.innerHTML = `<img src="${esc(data.signedUrl)}" alt="">`;
    else if ((b.dataset.type || '').startsWith('audio/')) holder.innerHTML = `<audio controls preload="none" src="${esc(data.signedUrl)}" style="width:100%"></audio>`;
    else holder.innerHTML = `<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">Open file</a>`;
    return;
  }
  if (b.dataset.del) {
    if (!confirm('Delete this message for everyone? This can’t be undone.')) return;
    b.disabled = true;
    const fp = box.dataset.fp;
    const { error } = await sb.rpc('admin_delete_messages', { p_ids: [b.dataset.del] });
    if (error) { $('#mvErr').textContent = error.message; b.disabled = false; return; }
    $('#mvErr').textContent = '';
    if (fp) {                                   // also free the storage space
      try {
        const { data: rm, error: re } = await sb.storage.from(BUCKET).remove([fp]);
        if (re || !rm || !rm.length) $('#mvErr').textContent = 'Message deleted, but its file could not be removed from storage. (Did you run admin-groups.sql?)';
      } catch (_) {}
    }
    document.querySelectorAll(`[data-mid="${b.dataset.del}"]`).forEach(el => el.remove());   // if it was open in your own chat list
    box.remove();
  }
}

    <div class="durrow"><input type="number" id="banN" min="1" max="100000" value="10"><select id="banU">${DUR_UNITS.map(([n, m]) => `<option value="${m}">${n}</option>`).join('')}</select></div>
    <label class="chk"><input type="checkbox" id="banPerm"> Permanent (until you unban them)</label>

    <div class="actions"><button class="btn ghost" id="banCancel">Cancel</button><button class="btn danger" id="banGo">Ban</button></div>`);
  const setDur = mins => {
    const u = [10080, 1440, 60, 1].find(x => mins % x === 0);
    $('#banU').value = String(u); $('#banN').value = mins / u; $('#banPerm').checked = false; lockDur();
  };
  const lockDur = () => { const on = $('#banPerm').checked; $('#banN').disabled = on; $('#banU').disabled = on; };
  document.querySelectorAll('#modal .chips button').forEach(b => b.onclick = () => setDur(+b.dataset.q));
  $('#banPerm').onchange = lockDur;
  $('#banCancel').onclick = () => back ? openAdmin() : closeModal();
  $('#banGo').onclick = async () => {
    const perm = $('#banPerm').checked, n = Math.floor(+$('#banN').value), mins = n * (+$('#banU').value);
    const errEl = $('#banErr');
    if (!perm && (!(n >= 1) || mins > 5256000)) { errEl.textContent = 'Enter a length of at least 1 minute (up to 10 years).'; return; }
    const btn = $('#banGo'); btn.disabled = true; errEl.textContent = '';

    clearTimeout(limitTimer); limitTimer = setTimeout(() => checkLimit(false), 4000);
  };
}

const PRESETS = ['🦊|#f97316','🐼|#64748b','🐸|#16a34a','🦄|#c026d3','🐙|#e11d48','🐧|#0ea5e9',
  '🦁|#eab308','🐯|#ea580c','🐨|#78716c','🐵|#a16207','🦉|#7c3aed','🐢|#15803d',
  '😎|#4f46e5','🤖|#0891b2','👾|#9333ea','👻|#475569','🎮|#2563eb','⚽|#16a34a',
  '🎵|#db2777','🔥|#dc2626','🚀|#4338ca','🌈|#f59e0b','🍕|#ea580c','⭐|#ca8a04'];

function pubUrl(path) {
  if (!path) return '';
  // already a full URL — use as-is
  if (/^https?:\/\//i.test(path)) return path;
  return sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
}
function avBg(a) {
  if (!a || !a.includes('|')) return '';
  const c = a.split('|')[1];
  return /^#[0-9a-f]{6}$/i.test(c) ? c : '';
}
const avStyle = a => avBg(a) ? 'background:' + avBg(a) : '';
function avInner(a, name) {
  if (!a) return esc(initial(name));
  // preset emoji avatar e.g. "😎|#4f46e5"
  if (a.includes('|')) return '<span class="em">' + esc(a.split('|')[0]) + '</span>';
  // uploaded image — show initial if the file fails to load
  const src = pubUrl(a);
  const letter = esc(initial(name));
  return '<img src="' + esc(src) + '" alt="" onerror="this.style.display=\'none\';if(!this.dataset.fb){this.dataset.fb=1;this.parentNode.appendChild(document.createTextNode(\'' + letter + '\'));}">';
}
function setAv(el, a, name) {
  if (!el) return;
  el.style.background = avBg(a) || '';
  if (a && !String(a).includes('|')) el.style.background = '';
  el.innerHTML = avInner(a, name);
}
function convAvatar(c) {
  if (c.is_group) return c.avatar_url || null;
  return c.conversation_members.find(m => m.user_id !== me.id)?.profiles?.avatar_url || null;
}

async function squareBlob(file, size = 256) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  cv.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
}
async function uploadAvatar(prefix, blob) {
  const path = `${prefix}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) { alert('Upload failed: ' + error.message); throw error; }
  return path;
}

/* ================================================================
   MESSAGE LENGTH LIMIT
   ================================================================ */
const lineCount = s => s.split('\n').length;
function clampText(s) {
  let lines = s.split('\n');
  if (lines.length > MAX_LINES) lines = lines.slice(0, MAX_LINES);
  s = lines.join('\n');
  return s.length > MAX_CHARS ? s.slice(0, MAX_CHARS) : s;
}
let limitTimer;
function limitNote(txt, bad) {
  const n = $('#limitNote');
  if (!txt) { n.classList.add('hidden'); return; }
  n.textContent = txt; n.style.color = bad ? 'var(--danger)' : 'var(--muted)'; n.classList.remove('hidden');
}
function checkLimit(flash) {
  clearTimeout(limitTimer);
  if (flash) {
    limitNote(`Messages are limited to ${MAX_LINES} lines and ${MAX_CHARS} characters.`, true);
    limitTimer = setTimeout(() => checkLimit(false), 3000);
    return;
  }
  const v = $('#text').value, l = lineCount(v), c = v.length;
  if (l >= MAX_LINES - 2 || c >= MAX_CHARS * 0.8) limitNote(`${l}/${MAX_LINES} lines · ${c}/${MAX_CHARS} characters`, l >= MAX_LINES || c >= MAX_CHARS);
  else limitNote('');
}
