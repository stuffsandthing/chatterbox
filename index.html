      </div>
      <div class="lbl2">Size</div><input type="range" id="mkScale" min="0.1" max="4" step="0.05">
      <div class="lbl2">Rotate</div><input type="range" id="mkRot" min="-180" max="180" step="1">
      <div class="mkrow"><button class="btn ghost small" id="mkFront">Bring forward</button><button class="btn ghost small" id="mkBack">Send back</button>
        <button class="btn ghost small" id="mkDup">Duplicate</button><button class="btn danger small" id="mkDel">Delete</button></div>
    </div>
    <div class="actions"><button class="btn ghost" id="mkCancel">Back</button><button class="btn" id="mkSave">Use this picture</button></div>`);

  const cv = $('#mkCv'), ctx = cv.getContext('2d');
  const fontOf = L => `${L.bold ? '700 ' : ''}${L.size}px ${L.font}`;
  const bounds = L => {
    if (L.type === 'img') return { w: L.w, h: L.h };
    ctx.font = fontOf(L);
    return { w: Math.max(20, ctx.measureText(L.text || ' ').width), h: L.size * 1.25 };
  };

  function draw(forExport = false, c = ctx) {
    c.clearRect(0, 0, S, S); c.fillStyle = bg; c.fillRect(0, 0, S, S);
    for (const L of layers) {
      c.save(); c.translate(L.x, L.y); c.rotate(L.rot * Math.PI / 180); c.scale(L.scale, L.scale);
      if (L.type === 'img') c.drawImage(L.img, -L.w / 2, -L.h / 2, L.w, L.h);
      else { c.font = fontOf(L); c.fillStyle = L.color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(L.text, 0, 0); }
      c.restore();
    }
    if (forExport) return;
    // dim everything outside the circle, because pictures are shown round
    c.save(); c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.rect(0, 0, S, S); c.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2, false); c.fill('evenodd'); c.restore();
    c.save(); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.beginPath(); c.arc(S / 2, S / 2, S / 2 - 1, 0, Math.PI * 2); c.stroke(); c.restore();
    if (sel) {
      const b = bounds(sel);
      c.save(); c.translate(sel.x, sel.y); c.rotate(sel.rot * Math.PI / 180); c.scale(sel.scale, sel.scale);
      c.strokeStyle = '#fff'; c.setLineDash([8 / sel.scale, 6 / sel.scale]); c.lineWidth = 2 / sel.scale;
      c.strokeRect(-b.w / 2 - 6, -b.h / 2 - 6, b.w + 12, b.h + 12); c.restore();
    }
  }

  function sync() {
    $('#mkLayer').classList.toggle('hidden', !sel);
    if (!sel) return;
    $('#mkTextRow').classList.toggle('hidden', sel.type !== 'text');
    if (sel.type === 'text') { $('#mkTxt').value = sel.text; $('#mkCol').value = sel.color; $('#mkFont').value = sel.font; $('#mkBold').checked = sel.bold; }
    $('#mkScale').value = sel.scale; $('#mkRot').value = sel.rot;
  }
  function addLayer(L) {
    if (layers.length >= 15) return alert('That’s plenty of layers! Delete one first.');
    L.id = nextId++; layers.push(L); sel = L; sync(); draw();
  }
  const base = { x: S / 2, y: S / 2, scale: 1, rot: 0 };

  // pick + drag layers
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * S / r.width, y: (e.clientY - r.top) * S / r.height }; };
  const hit = (px, py) => {
    for (let i = layers.length - 1; i >= 0; i--) {
      const L = layers[i], b = bounds(L), a = -L.rot * Math.PI / 180, dx = px - L.x, dy = py - L.y;
      const lx = (dx * Math.cos(a) - dy * Math.sin(a)) / L.scale, ly = (dx * Math.sin(a) + dy * Math.cos(a)) / L.scale;
      if (Math.abs(lx) <= b.w / 2 + 6 && Math.abs(ly) <= b.h / 2 + 6) return L;
    }
    return null;
  };
  cv.onpointerdown = e => {
    const p = pt(e), L = hit(p.x, p.y); sel = L;
    if (L) { drag = { ox: p.x - L.x, oy: p.y - L.y }; try { cv.setPointerCapture(e.pointerId); } catch {} }
    sync(); draw();
  };
  cv.onpointermove = e => { if (!drag || !sel) return; const p = pt(e); sel.x = p.x - drag.ox; sel.y = p.y - drag.oy; draw(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  cv.onwheel = e => {
    if (!sel) return; e.preventDefault();
    sel.scale = Math.min(4, Math.max(.1, sel.scale * (e.deltaY < 0 ? 1.06 : .94))); sync(); draw();
  };

  // background
  $('#mkBg').oninput = e => { bg = e.target.value; draw(); };
  document.querySelectorAll('#modal [data-bg]').forEach(b => b.onclick = () => { bg = b.dataset.bg; $('#mkBg').value = bg; draw(); });

  // add things
  $('#mkText').onclick = () => {
    addLayer({ ...base, type: 'text', text: 'Hello', size: 90, color: '#ffffff', font: MK_FONTS[0][1], bold: true });
    $('#mkTxt').focus(); $('#mkTxt').select();
  };
  document.querySelectorAll('#modal [data-emo]').forEach(b => b.onclick = () =>
    addLayer({ ...base, type: 'text', text: b.dataset.emo, size: 220, color: '#ffffff', font: MK_FONTS[0][1], bold: false }));
  $('#mkImg').onclick = () => $('#mkFile').click();
  $('#mkFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const img = new Image(); img.src = URL.createObjectURL(f);
    try { await img.decode(); } catch { return alert('That image couldn’t be read. Try a JPG or PNG.'); }
    const k = 320 / Math.max(img.naturalWidth, img.naturalHeight);
    addLayer({ ...base, type: 'img', img, w: img.naturalWidth * k, h: img.naturalHeight * k });
  };

  // edit the selected thing
  $('#mkTxt').oninput = e => { if (sel?.type === 'text') { sel.text = e.target.value; draw(); } };
  $('#mkCol').oninput = e => { if (sel?.type === 'text') { sel.color = e.target.value; draw(); } };
  $('#mkFont').onchange = e => { if (sel?.type === 'text') { sel.font = e.target.value; draw(); } };
  $('#mkBold').onchange = e => { if (sel?.type === 'text') { sel.bold = e.target.checked; draw(); } };
  $('#mkScale').oninput = e => { if (sel) { sel.scale = +e.target.value; draw(); } };
  $('#mkRot').oninput = e => { if (sel) { sel.rot = +e.target.value; draw(); } };
  $('#mkFront').onclick = () => { const i = layers.indexOf(sel); if (i >= 0 && i < layers.length - 1) { layers.splice(i, 1); layers.splice(i + 1, 0, sel); draw(); } };
  $('#mkBack').onclick = () => { const i = layers.indexOf(sel); if (i > 0) { layers.splice(i, 1); layers.splice(i - 1, 0, sel); draw(); } };
  $('#mkDup').onclick = () => { if (sel) addLayer({ ...sel, x: sel.x + 24, y: sel.y + 24 }); };
  $('#mkDel').onclick = () => { layers = layers.filter(l => l !== sel); sel = null; sync(); draw(); };

  $('#mkCancel').onclick = onCancel;
  $('#mkSave').onclick = async () => {
    const btn = $('#mkSave'); btn.disabled = true; btn.textContent = 'Saving…';
    sel = null; draw();
    const out = document.createElement('canvas'); out.width = out.height = S;
    draw(true, out.getContext('2d'));
    const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.9));
    try { await onSave(blob); closeModal(); }
    catch { btn.disabled = false; btn.textContent = 'Use this picture'; }
  };

  // start with your initial so there's something to play with
  addLayer({ ...base, type: 'text', text: initial(name), size: 260, color: '#ffffff', font: MK_FONTS[0][1], bold: true });
}

/* ================================================================
   ONLINE STATUS (who is on right now) + last seen
   Requires a last_seen timestamptz column on public.profiles:
     alter table public.profiles add column if not exists last_seen timestamptz;
   ================================================================ */
let online = new Set();
let presenceCh = null;
let lastSeenTimer = null;

function dmOther(c) { return c.is_group ? '' : (c.conversation_members.find(m => m.user_id !== me.id)?.user_id || ''); }

function refreshOnline() {
  document.querySelectorAll('.av[data-uid]').forEach(e => {
    const uid = e.dataset.uid;
    const isOn = !!uid && online.has(uid);
    e.classList.toggle('online', isOn);
    // red offline dot only when we know the person (have a uid) and they are offline
    e.classList.toggle('offline', !!uid && !isOn);
  });
}

async function bumpLastSeen() {
  if (!me) return;
  const now = new Date().toISOString();
  if (myProfile) myProfile.last_seen = now;
  if (profiles[me.id]) profiles[me.id].last_seen = now;
  const { error } = await sb.from('profiles').update({ last_seen: now }).eq('id', me.id);
  if (error) {
    // Column missing or RLS blocked — log once so it's easy to debug
    if (!bumpLastSeen._warned) {
      bumpLastSeen._warned = true;
      console.warn('[Chatterbox] Could not save last_seen. Run this in Supabase SQL:',
        'alter table public.profiles add column if not exists last_seen timestamptz;');
      console.warn('Supabase error:', error.message);
    }
  }
}

function markLocalLastSeen(uid) {
  if (!uid) return;
  const now = new Date().toISOString();
  if (!profiles[uid]) profiles[uid] = { id: uid };
  profiles[uid].last_seen = now;
  // also update any conversation member profile objects we already have
  convs.forEach(c => {
    const m = c.conversation_members?.find(x => x.user_id === uid);
    if (m?.profiles) m.profiles.last_seen = now;
  });
}

function startPresence() {
  stopPresence();
  presenceCh = sb.channel('lobby', { config: { presence: { key: me.id } } });
  presenceCh.on('presence', { event: 'sync' }, () => {
    const prev = online;
    const next = new Set(Object.keys(presenceCh.presenceState()));
    // anyone who just left → record last seen locally right now
    prev.forEach(uid => {
      if (!next.has(uid) && uid !== me.id) markLocalLastSeen(uid);
    });
    online = next;
    if (tab === 'chats') renderChats();
    refreshOnline();
    const c = activeId && getConv(activeId); if (c) $('#chSub').textContent = convSub(c);
    if (call) renderCallPeople();
  }).subscribe(async status => {
    if (status === 'SUBSCRIBED') {
      await presenceCh.track({ at: Date.now() });
      bumpLastSeen();
    }
  });
  // heartbeat every 45s so last_seen stays fresh while the tab is open
  clearInterval(lastSeenTimer);
  lastSeenTimer = setInterval(bumpLastSeen, 45000);
  // try to write last_seen when the tab is closed / hidden
  window.addEventListener('pagehide', bumpLastSeen);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') bumpLastSeen();
  });
}
function stopPresence() {
  if (presenceCh) { sb.removeChannel(presenceCh); presenceCh = null; }
  online = new Set();
  clearInterval(lastSeenTimer);
  lastSeenTimer = null;
}

/* ================================================================
   VOICE + VIDEO CALLS (WebRTC, everyone connects to everyone)
   Works well for up to ~5 people. Only people with the site open
   ("online") can be rung.
   To make calls work on strict networks (school wifi, some mobile
   data) add a TURN server to this list.
   ================================================================ */
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // , { urls: 'turn:YOUR-TURN-SERVER:3478', username: '...', credential: '...' }
];

let sigCh = null, call = null, incoming = null;
let ac = null, ringIv = null;
const others = c => (getConv(c.convId)?.conversation_members || []).map(m => m.user_id).filter(u => u !== me.id);
const nameFor = u => profiles[u]?.display_name || 'Someone';

/* ---- ringtone ---- */
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); document.getElementById('soundHint')?.classList.add('hidden'); } catch {}
}, { passive: true }));
function startRing() {
  stopRing();
  const beep = () => {
    if (!ac) return;
    [0, .35].forEach((d, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = i ? 520 : 440; o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime + d;
      g.gain.setValueAtTime(.15, t); g.gain.setValueAtTime(0, t + .3);
      o.start(t); o.stop(t + .32);
    });
  };
  beep(); ringIv = setInterval(beep, 2200);
  try { navigator.vibrate?.([300, 200, 300]); } catch {}
}
function stopRing() { clearInterval(ringIv); ringIv = null; }

/* ---- signalling over the call_signals table ---- */
function startSignals() {
  if (sigCh) sb.removeChannel(sigCh);
  sigCh = sb.channel('signals-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'call_signals', filter: 'to_user=eq.' + me.id }, p => handleSignal(p.new))
    .subscribe();
}
async function sendSignals(c, toUsers, type, payload = {}) {
  if (!toUsers.length) return;
  const rows = toUsers.map(u => ({ conversation_id: c.convId, call_id: c.id, from_user: me.id, to_user: u, type, payload }));
  const { error } = await sb.from('call_signals').insert(rows);
  if (error) console.warn('call signal failed:', error.message);
}
function stopCalls() { hangUp(true); dismissIncoming(); if (sigCh) { sb.removeChannel(sigCh); sigCh = null; } stopPresence(); }

async function handleSignal(s) {
  const p = s.payload || {}, from = s.from_user;
  if (s.type === 'ring') return onRing(s);
  if (incoming && incoming.callId === s.call_id && s.type === 'leave') return dismissIncoming();
  if (!call || call.id !== s.call_id) return;
  const group = getConv(call.convId)?.is_group;
  switch (s.type) {
    case 'hello': call.status[from] = 'joined'; if (!call.peers[from]) await callPeer(from); break;
    case 'offer': call.status[from] = 'joined'; await onOffer(from, p.sdp); break;
    case 'answer': await onAnswer(from, p.sdp); break;
    case 'ice': addIce(from, p.c); break;
    case 'state': { const wasOut = call.state[from]?.outro; call.state[from] = p; updateTile(from); if (p.outro && !wasOut) onPeerOutro(from); break; }
    case 'screen': if (!p.on) removeScreen(from); break;
    case 'decline': call.status[from] = 'declined'; if (!group) endAfter(nameFor(from) + ' declined'); break;
    case 'busy': call.status[from] = 'busy'; if (!group) endAfter(nameFor(from) + ' is busy'); break;
    case 'leave': closePeer(from); call.status[from] = 'left'; if (!group) endAfter('Call ended'); break;
  }
  if (call) renderCallPeople();
}

/* ---- incoming ring ---- */
function onRing(s) {
  const p = s.payload || {};
  if (call && call.id === s.call_id) return;
  if (call || incoming) {
    if (!(incoming && incoming.callId === s.call_id)) sendSignals({ id: s.call_id, convId: s.conversation_id }, [s.from_user], 'busy');
    return;
  }
  incoming = { callId: s.call_id, convId: s.conversation_id, from: s.from_user, kind: p.kind || 'audio' };
  setAv($('#inAv'), profiles[s.from_user]?.avatar_url, p.fromName);
  $('#inTitle').textContent = (p.fromName || 'Someone') + ' is calling…';
  $('#inSub').textContent = (p.kind === 'video' ? 'Video call' : 'Voice call') + (p.title ? ' · ' + p.title : '');
  $('#incoming').classList.remove('hidden');
  startRing();
  incoming.timer = setTimeout(dismissIncoming, 45000);
}
function dismissIncoming() {
  if (incoming) clearTimeout(incoming.timer);
  incoming = null; stopRing();
  $('#incoming').classList.add('hidden');
}
$('#inAccept').onclick = async () => {
  const inc = incoming; if (!inc) return;
  dismissIncoming();
  if (!getConv(inc.convId)) await loadConvs();
  if (!getConv(inc.convId)) return;
  joinCall(inc.callId, inc.convId, inc.kind, false);
};
$('#inDecline').onclick = () => {
  const inc = incoming; if (!inc) return;
  dismissIncoming();
  sendSignals({ id: inc.callId, convId: inc.convId }, [inc.from], 'decline');
};

/* ---- starting a call ---- */
$('#callVoice').onclick = () => preCall('audio');
$('#callVideo').onclick = () => preCall('video');

function preCall(kind) {
  if (!activeId) return;
  if (call || incoming) return alert('You are already in a call.');
  const c = getConv(activeId), ids = others({ convId: c.id });
  const onl = ids.filter(u => online.has(u));
  openModal(`<h3>${kind === 'video' ? 'Video' : 'Voice'} call · ${esc(convTitle(c))}</h3>
    <div style="color:var(--muted);font-size:13px;margin-bottom:8px">Only people who are online right now can be rung.</div>
    ${ids.map(u => `<div class="chk">${online.has(u) ? '🟢' : '⚪'} <b>${esc(nameFor(u))}</b> <span style="color:var(--muted)">${online.has(u) ? 'online, will be rung' : 'offline, can’t be rung'}</span></div>`).join('')}
    ${onl.length ? '' : '<div class="empty" style="padding:14px 0 0">Nobody here is online right now.</div>'}
    <div class="actions"><button class="btn ghost" id="pcCancel">Cancel</button>${onl.length ? `<button class="btn" id="pcStart">Call ${onl.length} online</button>` : ''}</div>`);
  $('#pcCancel').onclick = closeModal;
  if (onl.length) $('#pcStart').onclick = () => { closeModal(); beginCall(kind, c.id); };
}

async function beginCall(kind, convId) {
  const ids = others({ convId });
  if (!(await joinCall(crypto.randomUUID(), convId, kind, true))) return;
  ids.forEach(u => { call.status[u] = 'offline'; });
  ringMembers(ids.filter(u => online.has(u)));
}

function ringMembers(uids) {
  const c = call, conv = getConv(c.convId);
  uids.forEach(u => {
    c.status[u] = 'ringing';
    setTimeout(() => {
      if (call !== c || c.status[u] !== 'ringing') return;
      c.status[u] = 'no answer'; renderCallPeople();
      if (!conv.is_group && !Object.keys(c.peers).length) endAfter('No answer');
    }, 45000);
  });
  sendSignals(c, uids, 'ring', { kind: c.kind, fromName: myProfile.display_name, title: conv.is_group ? convTitle(conv) : '' });
  renderCallPeople();
}

async function joinCall(id, convId, kind, host) {
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
    alert('Calls need a browser that supports them and a secure (https) page.'); return false;
  }
  let local = null;
  try { local = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'video' ? { width: { ideal: 1280 }, height: { ideal: 720 }, aspectRatio: { ideal: 16 / 9 } } : false }); }
  catch {
    if (kind === 'video') {
      try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); alert('Couldn’t use your camera, so you’re joining with audio only.'); } catch {}
    }
  }
  if (!local) { alert('Couldn’t use your microphone. Allow access in the browser (icon next to the address bar) and try again.'); return false; }

  const conv = getConv(convId);
  call = { id, convId, kind, local, peers: {}, pendingIce: {}, status: {}, state: {}, started: Date.now(), timer: null };
  loadOutro();
  const hasVid = local.getVideoTracks().length > 0;
  $('#callTitle').textContent = convTitle(conv);
  $('#callGrid').innerHTML = '';
  $('#localVideo').srcObject = local;
  $('#localVideo').classList.remove('novid');
  setAv($('#localBig'), myProfile.avatar_url, myProfile.display_name);
  $('#localTile').classList.toggle('hidden', !hasVid);
  $('#cCam').classList.toggle('hidden', !hasVid);
  $('#cShare').classList.toggle('hidden', !navigator.mediaDevices?.getDisplayMedia);   // phones usually can't share
  $('#cMic').classList.remove('off'); $('#cMic').textContent = '🎤';
  $('#cCam').classList.remove('off');
  $('#callTimer').textContent = '0:00';
  $('#call').classList.remove('hidden');
  call.timer = setInterval(() => {
    if (!call) return;
    const s = Math.floor((Date.now() - call.started) / 1000);
    $('#callTimer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
  renderCallPeople();
  if (!host) sendSignals(call, others(call), 'hello');
  return true;
}

/* ---- peer connections ---- */
const micOn = () => call?.local.getAudioTracks()[0]?.enabled !== false;
const camOn = () => { const t = call?.local.getVideoTracks()[0]; return !!t && t.enabled; };

function makePeer(uid) {
  const c = call;
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, polite: me.id > uid };
  c.peers[uid] = peer;
  c.local.getTracks().forEach(t => pc.addTrack(t, c.local));
  pc.onicecandidate = e => { if (e.candidate && call === c) sendSignals(c, [uid], 'ice', { c: e.candidate.toJSON() }); };
  // if we're already sharing when someone joins, they get the screen too
  if (c.screen) c.screen.senders[uid] = c.screen.stream.getTracks().map(t => pc.addTrack(t, c.screen.stream));
  // adding/removing a screen later means negotiating again (only after the first handshake is done)
  pc.onnegotiationneeded = async () => {
    if (!peer.ready || call !== c) return;
    try {
      const offer = await pc.createOffer();
      if (pc.signalingState !== 'stable') return;
      await pc.setLocalDescription(offer);
      await sendSignals(c, [uid], 'offer', { sdp: { type: offer.type, sdp: offer.sdp } });
    } catch (e) { console.warn(e); }
  };
  pc.ontrack = e => {
    const s = e.streams[0]; if (!s) return;
    if (!peer.mainId) peer.mainId = s.id;                 // first stream = their camera/mic
    if (s.id !== peer.mainId) return showScreen(uid, s);  // any other stream = their shared screen
    const t = ensureTile(uid);
    if (t.video.srcObject !== e.streams[0]) t.video.srcObject = e.streams[0];
    t.video.play().catch(() => {});
    updateTile(uid);
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    const st = pc.connectionState;
    if (st === 'connected') { c.status[uid] = 'joined'; sendSignals(c, [uid], 'state', { cam: camOn(), mic: micOn() }); }
    if (st === 'failed' || st === 'closed') { closePeer(uid); c.status[uid] = 'connection failed'; }
    renderCallPeople();
  };
  ensureTile(uid);
  return peer;
}
async function callPeer(uid) {
  const c = call, p = c.peers[uid] || makePeer(uid);
  try {
    const offer = await p.pc.createOffer();
    await p.pc.setLocalDescription(offer);
    await sendSignals(c, [uid], 'offer', { sdp: { type: offer.type, sdp: offer.sdp } });
  } catch (e) { console.warn(e); }
}
async function onOffer(from, sdp) {
  const c = call, p = c.peers[from] || makePeer(from), pc = p.pc;
  try {
    if (pc.signalingState !== 'stable' && !p.polite) return;      // glare: the other side wins
    await pc.setRemoteDescription(sdp);
    await flushIce(from);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    p.ready = true;
    await sendSignals(c, [from], 'answer', { sdp: { type: answer.type, sdp: answer.sdp } });
  } catch (e) { console.warn(e); }
}

/* ================================================================
   LEAVE SONG: pressing End call keeps you in the call for 10 seconds
   while the outro plays (for you AND everyone still in the call),
   then you really leave. The song is embedded at the very bottom of
   this file (OUTRO_B64), so there is still only one file to upload.
   ================================================================ */
const OUTRO_MS = 10200;                    // the song is 10.05 s long
const OUTRO_VOLUME = 0.12;                 // how loud it plays, 0 to 1 (the song is mastered very loud, so this sits under people's voices). Make it smaller for quieter.
let outroBuf = null, outroNode = null, outroAudio = null;

function outroCtx() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch {}
  return ac;
}
async function loadOutro() {               // decode once, so it starts instantly later
  if (outroBuf || !outroCtx()) return;
  try {
    const bin = atob(OUTRO_B64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    outroBuf = await ac.decodeAudioData(bytes.buffer);
  } catch (e) { console.warn('[Chatterbox] could not prepare the leave song', e); }
}
function playOutro() {
  stopOutro();
  const ctx = outroCtx();
  if (ctx && outroBuf) {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = outroBuf;
    const t = ctx.currentTime, d = outroBuf.duration;       // fade in and out so it never jumps out at anyone
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(OUTRO_VOLUME, t + 1.5);
    g.gain.setValueAtTime(OUTRO_VOLUME, t + d - 1.5);
    g.gain.linearRampToValueAtTime(0.0001, t + d);
    src.connect(g); g.connect(ctx.destination); src.start();
    outroNode = src;
  } else {                                 // not decoded yet: use a plain audio tag this time
    try { outroAudio = new Audio('data:audio/mpeg;base64,' + OUTRO_B64); outroAudio.volume = OUTRO_VOLUME; outroAudio.play().catch(() => {}); } catch {}
    loadOutro();
  }
}
function stopOutro() {
  try { outroNode?.stop(); } catch {} outroNode = null;
  try { outroAudio?.pause(); } catch {} outroAudio = null;
}
function resetOutroUi() {
  $('#outroBar').classList.add('hidden'); $('#outroBar').textContent = '';
  const b = $('#cEnd'); b.disabled = false; b.style.opacity = ''; b.textContent = 'End call';
}

function startLeaving() {
  const c = call; if (!c || c.leaving) return;
  c.leaving = true;
  const b = $('#cEnd'); b.disabled = true; b.style.opacity = '.6'; b.textContent = 'Leaving…';
  broadcastState();                        // everyone else hears the song too
  playOutro();
  const t0 = Date.now(), bar = $('#outroBar');
  bar.classList.remove('hidden');
  const tick = () => {
    if (call !== c) return clearInterval(c.outroIv);
    const left = Math.min(10, Math.max(0, Math.ceil((OUTRO_MS - (Date.now() - t0)) / 1000)));
    bar.textContent = '🎵 Leaving in ' + left + 's…';
  };
  tick(); c.outroIv = setInterval(tick, 250);
  c.outroTimer = setTimeout(() => { if (call === c) hangUp(); }, OUTRO_MS);
}
function onPeerOutro(uid) {                // somebody else pressed End call
  const c = call; if (!c || c.leaving) return;
  playOutro();
  const bar = $('#outroBar');
  bar.textContent = '🎵 ' + nameFor(uid) + ' is leaving…';
  bar.classList.remove('hidden');
  clearTimeout(c.outroHide);
  c.outroHide = setTimeout(() => { if (call === c && !c.leaving) bar.classList.add('hidden'); }, OUTRO_MS);
}
// King Mode: only people who switch it on play the send-off song when THEY leave.
const kingKey = () => 'cb_king_' + (me ? me.id : '');
function kingOn() { try { return localStorage.getItem(kingKey()) === '1'; } catch (_) { return false; } }
function setKing(on) { try { localStorage.setItem(kingKey(), on ? '1' : '0'); } catch (_) {} }

/* ---- in-call chat (same chat as the conversation you're calling in) ---- */
let ccUnread = 0, ccDrag = null;
function updateBadge() { $('#ccBadge').textContent = ccUnread; $('#ccBadge').classList.toggle('hidden', !ccUnread); }

// keep the panel on screen and never over the call buttons
function placeChat(x, y) {
  const p = $('#callChat'), w = p.offsetWidth;
  const barTop = $('#callBar').getBoundingClientRect().top - 8;
  x = Math.min(Math.max(0, x), Math.max(0, innerWidth - w));
  y = Math.min(Math.max(0, y), Math.max(0, barTop - 160));
  p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.right = 'auto';
  p.style.maxHeight = Math.max(160, barTop - y) + 'px';
}
$('#ccHead').onpointerdown = e => {
  if (e.target.closest('button')) return;
  const r = $('#callChat').getBoundingClientRect();
  ccDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  try { $('#ccHead').setPointerCapture(e.pointerId); } catch {}
};
$('#ccHead').onpointermove = e => { if (ccDrag) placeChat(e.clientX - ccDrag.dx, e.clientY - ccDrag.dy); };
$('#ccHead').onpointerup = $('#ccHead').onpointercancel = () => { ccDrag = null; };
window.addEventListener('resize', () => {
  const p = $('#callChat'); if (p.classList.contains('hidden')) return;
  const r = p.getBoundingClientRect(); placeChat(r.left, r.top);
});

async function toggleCallChat(force) {
  if (!call) return;
  const p = $('#callChat'), show = force ?? p.classList.contains('hidden');
  p.classList.toggle('hidden', !show);
  if (!show) return;
  ccUnread = 0; updateBadge();
  if (!p.style.left) placeChat(innerWidth - p.offsetWidth - 14, 70);
  if (!call.ccLoaded) {
    call.ccLoaded = true;
    const c = call;
    const { data } = await sb.from('messages').select('*').eq('conversation_id', c.convId).order('created_at', { ascending: false }).limit(30);
    if (call === c) { $('#ccMsgs').innerHTML = ''; (data || []).reverse().forEach(m => callChatAdd(m, true)); }
  }

function callChatAdd(m, quiet) {
  if (!call || m.conversation_id !== call.convId) return;
  const box = $('#ccMsgs');
  if (box.querySelector(`[data-id="${m.id}"]`)) return;
  const mine = m.sender_id === me.id;
  const body = m.body || (m.file_type?.startsWith('audio/') ? '🎤 voice message' : m.file_name ? '📎 ' + m.file_name : '');
  const div = document.createElement('div');
  div.className = 'ccm' + (mine ? ' me' : ''); div.dataset.id = m.id;
  div.innerHTML = (mine ? '' : `<span class="n">${esc(nameFor(m.sender_id))}</span>`) + esc(body);
  box.appendChild(div); box.scrollTop = box.scrollHeight;
  if (!quiet && !mine && $('#callChat').classList.contains('hidden')) { ccUnread++; updateBadge(); }
}
async function sendCallMsg() {
  const t = $('#ccText');
  let body = clampText(t.value).trim();
  if (!body || !call) return;
  if (banGuard()) return;
  body = cleanOrBlock(body);
  if (body === null) return;
  if (!spamOk(body, true)) return;
  const c = call;
  t.value = '';
  const { data, error } = await sb.from('messages').insert({ conversation_id: c.convId, sender_id: me.id, body }).select().single();
  if (error) { t.value = body; return sendErr(error); }
  callChatAdd(data);
  if (activeId === data.conversation_id) appendMsg(data);
  bumpConv(data.conversation_id);
}

  const p = $('#callChat');
  p.classList.add('hidden'); p.style.left = p.style.top = p.style.maxHeight = ''; p.style.right = '';

/* ---- screen sharing ---- */
async function startShare() {
  const c = call; if (!c || c.screen) return;
  let stream;
  try { stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 15, max: 30 } }, audio: true }); }
  catch (e) { if (e.name !== 'NotAllowedError') alert('Couldn’t start screen sharing: ' + (e.message || e.name)); return; }
  if (call !== c) { stream.getTracks().forEach(t => t.stop()); return; }
  c.screen = { stream, senders: {} };
  stream.getVideoTracks()[0].onended = stopShare;          // the browser's own "Stop sharing" button
  Object.keys(c.peers).forEach(uid => {
    c.screen.senders[uid] = stream.getTracks().map(t => c.peers[uid].pc.addTrack(t, stream));
  });
  $('#cShare').classList.add('sharing'); $('#shareBar').classList.remove('hidden');
}
function stopShare() {
  const c = call; if (!c?.screen) return;
  const { stream, senders } = c.screen; c.screen = null;
  stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
  Object.entries(senders).forEach(([uid, list]) => {
    const p = c.peers[uid];
    if (p) list.forEach(s => { try { p.pc.removeTrack(s); } catch {} });
  });
  sendSignals(c, Object.keys(c.peers), 'screen', { on: false });
  $('#cShare').classList.remove('sharing'); $('#shareBar').classList.add('hidden');
}
$('#cShare').onclick = () => (call?.screen ? stopShare() : startShare());
$('#shareStop').onclick = stopShare;

function showScreen(uid, stream) {
  let el = document.getElementById('screen-' + uid);
  if (!el) {
    el = document.createElement('div'); el.className = 'tile screen'; el.id = 'screen-' + uid;
    el.innerHTML = `<video autoplay playsinline></video><span class="lbl">${esc(nameFor(uid))}’s screen</span><button class="fsb" title="Full screen">⛶</button>`;
    $('#callGrid').prepend(el);
    el.querySelector('.fsb').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.());
  }
  const v = el.querySelector('video');
  if (v.srcObject !== stream) v.srcObject = stream;
  v.play().catch(() => {});
  stream.onremovetrack = () => { if (!stream.getTracks().length) removeScreen(uid); };
  stream.getVideoTracks().forEach(t => { t.onended = () => removeScreen(uid); });
}
function removeScreen(uid) { document.getElementById('screen-' + uid)?.remove(); }

function endAfter(msg) {
  if (!call) return;
  const c = call; $('#callTitle').textContent = msg;
  setTimeout(() => { if (call === c) hangUp(); }, 1500);
}
async function hangUp(quiet = false) {
  const c = call; if (!c) return;
  call = null;
  clearInterval(c.timer);
  clearTimeout(c.outroTimer); clearInterval(c.outroIv); clearTimeout(c.outroHide);
  stopOutro(); resetOutroUi();
  Object.values(c.peers).forEach(p => { try { p.pc.close(); } catch {} });
  c.local.getTracks().forEach(t => t.stop());
  if (c.screen) c.screen.stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
  $('#cShare').classList.remove('sharing'); $('#shareBar').classList.add('hidden');
  resetCallChat();
  $('#call').classList.add('hidden');
  $('#callGrid').innerHTML = '';
  $('#localVideo').srcObject = null;
  if (quiet) return;
  await sendSignals(c, others(c), 'leave');
  await sb.from('call_signals').delete().eq('call_id', c.id).or(`from_user.eq.${me.id},to_user.eq.${me.id}`);
}
