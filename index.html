/* ================================================================
   ONLINE STATUS (who is on right now)
   ================================================================ */
let online = new Set();
let presenceCh = null;

function dmOther(c) { return c.is_group ? '' : (c.conversation_members.find(m => m.user_id !== me.id)?.user_id || ''); }
function refreshOnline() {
  document.querySelectorAll('.av[data-uid]').forEach(e => e.classList.toggle('online', !!e.dataset.uid && online.has(e.dataset.uid)));
}
function startPresence() {
  stopPresence();
  presenceCh = sb.channel('lobby', { config: { presence: { key: me.id } } });
  presenceCh.on('presence', { event: 'sync' }, () => {
    online = new Set(Object.keys(presenceCh.presenceState()));
    if (tab === 'chats') renderChats();
    refreshOnline();
    const c = activeId && getConv(activeId); if (c) $('#chSub').textContent = convSub(c);
    if (call) renderCallPeople();
  }).subscribe(async status => { if (status === 'SUBSCRIBED') await presenceCh.track({ at: Date.now() }); });
}
function stopPresence() { if (presenceCh) { sb.removeChannel(presenceCh); presenceCh = null; } online = new Set(); }

/* ================================================================
   VOICE + VIDEO CALLS (WebRTC, everyone connects to everyone)
   Works well for up to ~5 people. Only people with the site open
   ("online") can be rung.
   To make calls work on strict networks (school wifi, some mobile
   data) add a TURN server to this list.
   ================================================================ */
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // , { urls: 'turn:YOUR-TURN-SERVER:3478', username: '...', credential: '...' }
];

let sigCh = null, call = null, incoming = null;
let ac = null, ringIv = null;
const others = c => (getConv(c.convId)?.conversation_members || []).map(m => m.user_id).filter(u => u !== me.id);
const nameFor = u => profiles[u]?.display_name || 'Someone';

/* ---- ringtone ---- */
document.addEventListener('pointerdown', () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {} }, { once: true });
function startRing() {
  stopRing();
  const beep = () => {
    if (!ac) return;
    [0, .35].forEach((d, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = i ? 520 : 440; o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime + d;
      g.gain.setValueAtTime(.15, t); g.gain.setValueAtTime(0, t + .3);
      o.start(t); o.stop(t + .32);
    });
  };
  beep(); ringIv = setInterval(beep, 2200);
  try { navigator.vibrate?.([300, 200, 300]); } catch {}
}
function stopRing() { clearInterval(ringIv); ringIv = null; }

/* ---- signalling over the call_signals table ---- */
function startSignals() {
  if (sigCh) sb.removeChannel(sigCh);
  sigCh = sb.channel('signals-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'call_signals', filter: 'to_user=eq.' + me.id }, p => handleSignal(p.new))
    .subscribe();
}
async function sendSignals(c, toUsers, type, payload = {}) {
  if (!toUsers.length) return;
  const rows = toUsers.map(u => ({ conversation_id: c.convId, call_id: c.id, from_user: me.id, to_user: u, type, payload }));
  const { error } = await sb.from('call_signals').insert(rows);
  if (error) console.warn('call signal failed:', error.message);
}
function stopCalls() { hangUp(true); dismissIncoming(); if (sigCh) { sb.removeChannel(sigCh); sigCh = null; } stopPresence(); }

async function handleSignal(s) {
  const p = s.payload || {}, from = s.from_user;
  if (s.type === 'ring') return onRing(s);
  if (incoming && incoming.callId === s.call_id && s.type === 'leave') return dismissIncoming();
  if (!call || call.id !== s.call_id) return;
  const group = getConv(call.convId)?.is_group;
  switch (s.type) {
    case 'hello': call.status[from] = 'joined'; if (!call.peers[from]) await callPeer(from); break;
    case 'offer': call.status[from] = 'joined'; await onOffer(from, p.sdp); break;
    case 'answer': await onAnswer(from, p.sdp); break;
    case 'ice': addIce(from, p.c); break;
    case 'state': call.state[from] = p; updateTile(from); break;
    case 'decline': call.status[from] = 'declined'; if (!group) endAfter(nameFor(from) + ' declined'); break;
    case 'busy': call.status[from] = 'busy'; if (!group) endAfter(nameFor(from) + ' is busy'); break;
    case 'leave': closePeer(from); call.status[from] = 'left'; if (!group) endAfter('Call ended'); break;
  }
  if (call) renderCallPeople();
}

/* ---- incoming ring ---- */
function onRing(s) {
  const p = s.payload || {};
  if (call && call.id === s.call_id) return;
  if (call || incoming) {
    if (!(incoming && incoming.callId === s.call_id)) sendSignals({ id: s.call_id, convId: s.conversation_id }, [s.from_user], 'busy');
    return;
  }
  incoming = { callId: s.call_id, convId: s.conversation_id, from: s.from_user, kind: p.kind || 'audio' };
  setAv($('#inAv'), profiles[s.from_user]?.avatar_url, p.fromName);
  $('#inTitle').textContent = (p.fromName || 'Someone') + ' is calling…';
  $('#inSub').textContent = (p.kind === 'video' ? 'Video call' : 'Voice call') + (p.title ? ' · ' + p.title : '');
  $('#incoming').classList.remove('hidden');
  startRing();
  incoming.timer = setTimeout(dismissIncoming, 45000);
}
function dismissIncoming() {
  if (incoming) clearTimeout(incoming.timer);
  incoming = null; stopRing();
  $('#incoming').classList.add('hidden');
}
$('#inAccept').onclick = async () => {
  const inc = incoming; if (!inc) return;
  dismissIncoming();
  if (!getConv(inc.convId)) await loadConvs();
  if (!getConv(inc.convId)) return;
  joinCall(inc.callId, inc.convId, inc.kind, false);
};
$('#inDecline').onclick = () => {
  const inc = incoming; if (!inc) return;
  dismissIncoming();
  sendSignals({ id: inc.callId, convId: inc.convId }, [inc.from], 'decline');
};

/* ---- starting a call ---- */
$('#callVoice').onclick = () => preCall('audio');
$('#callVideo').onclick = () => preCall('video');

function preCall(kind) {
  if (!activeId) return;
  if (call || incoming) return alert('You are already in a call.');
  const c = getConv(activeId), ids = others({ convId: c.id });
  const onl = ids.filter(u => online.has(u));
  openModal(`<h3>${kind === 'video' ? 'Video' : 'Voice'} call · ${esc(convTitle(c))}</h3>
    <div style="color:var(--muted);font-size:13px;margin-bottom:8px">Only people who are online right now can be rung.</div>
    ${ids.map(u => `<div class="chk">${online.has(u) ? '🟢' : '⚪'} <b>${esc(nameFor(u))}</b> <span style="color:var(--muted)">${online.has(u) ? 'online, will be rung' : 'offline, can’t be rung'}</span></div>`).join('')}
    ${onl.length ? '' : '<div class="empty" style="padding:14px 0 0">Nobody here is online right now.</div>'}
    <div class="actions"><button class="btn ghost" id="pcCancel">Cancel</button>${onl.length ? `<button class="btn" id="pcStart">Call ${onl.length} online</button>` : ''}</div>`);
  $('#pcCancel').onclick = closeModal;
  if (onl.length) $('#pcStart').onclick = () => { closeModal(); beginCall(kind, c.id); };
}

async function beginCall(kind, convId) {
  const ids = others({ convId });
  if (!(await joinCall(crypto.randomUUID(), convId, kind, true))) return;
  ids.forEach(u => { call.status[u] = 'offline'; });
  ringMembers(ids.filter(u => online.has(u)));
}

function ringMembers(uids) {
  const c = call, conv = getConv(c.convId);
  uids.forEach(u => {
    c.status[u] = 'ringing';
    setTimeout(() => {
      if (call !== c || c.status[u] !== 'ringing') return;
      c.status[u] = 'no answer'; renderCallPeople();
      if (!conv.is_group && !Object.keys(c.peers).length) endAfter('No answer');
    }, 45000);
  });
  sendSignals(c, uids, 'ring', { kind: c.kind, fromName: myProfile.display_name, title: conv.is_group ? convTitle(conv) : '' });
  renderCallPeople();
}

async function joinCall(id, convId, kind, host) {
  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
    alert('Calls need a browser that supports them and a secure (https) page.'); return false;
  }
  let local = null;
  try { local = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'video' ? { facingMode: 'user' } : false }); }
  catch {
    if (kind === 'video') {
      try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); alert('Couldn’t use your camera, so you’re joining with audio only.'); } catch {}
    }
  }
  if (!local) { alert('Couldn’t use your microphone. Allow access in the browser (icon next to the address bar) and try again.'); return false; }

  const conv = getConv(convId);
  call = { id, convId, kind, local, peers: {}, pendingIce: {}, status: {}, state: {}, started: Date.now(), timer: null, screenTrack: null, camTrack: null };
  call.camTrack = local.getVideoTracks()[0] || null;
  const hasVid = !!call.camTrack;
  $('#callTitle').textContent = convTitle(conv);
  $('#callGrid').innerHTML = '';
  $('#localVideo').srcObject = local;
  $('#localVideo').classList.remove('novid');
  $('#localVideo').classList.toggle('mirror', hasVid);
  setAv($('#localBig'), myProfile.avatar_url, myProfile.display_name);
  $('#localTile').classList.toggle('hidden', !hasVid);
  $('#cCam').classList.toggle('hidden', !hasVid);
  $('#cMic').classList.remove('off'); $('#cMic').textContent = '🎤';
  $('#cCam').classList.remove('off');
  $('#cShare').classList.remove('on'); $('#cShare').textContent = '🖥️';
  $('#callTimer').textContent = '0:00';
  $('#callChat').classList.remove('open');
  $('#callMsgs').innerHTML = '';
  $('#callText').value = '';
  loadCallChat(convId);
  $('#call').classList.remove('hidden');
  call.timer = setInterval(() => {
    if (!call) return;
    const s = Math.floor((Date.now() - call.started) / 1000);
    $('#callTimer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
  renderCallPeople();
  if (!host) sendSignals(call, others(call), 'hello');
  return true;
}

/* ---- peer connections ---- */
const micOn = () => call?.local.getAudioTracks()[0]?.enabled !== false;
const camOn = () => { const t = call?.local.getVideoTracks()[0]; return !!t && t.enabled; };
const sharing = () => !!call?.screenTrack;

function makePeer(uid) {
  const c = call;
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, polite: me.id > uid };
  c.peers[uid] = peer;
  c.local.getTracks().forEach(t => pc.addTrack(t, c.local));
  pc.onicecandidate = e => { if (e.candidate && call === c) sendSignals(c, [uid], 'ice', { c: e.candidate.toJSON() }); };
  pc.ontrack = e => {
    const t = ensureTile(uid);
    if (t.video.srcObject !== e.streams[0]) t.video.srcObject = e.streams[0];
    t.video.play().catch(() => {});
    updateTile(uid);
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    const st = pc.connectionState;
    if (st === 'connected') { c.status[uid] = 'joined'; sendSignals(c, [uid], 'state', { cam: camOn(), mic: micOn(), share: sharing() }); }
    if (st === 'failed' || st === 'closed') { closePeer(uid); c.status[uid] = 'connection failed'; }
    renderCallPeople();
  };
  ensureTile(uid);
  return peer;
}

async function replaceVideoTrack(track) {
  if (!call) return;
  for (const p of Object.values(call.peers)) {
    const sender = p.pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) {
      try { await sender.replaceTrack(track); } catch (e) { console.warn('replaceTrack', e); }
    } else if (track) {
      p.pc.addTrack(track, call.local);
    }
  }
  // update local stream
  const old = call.local.getVideoTracks()[0];
  if (old && old !== track) {
    call.local.removeTrack(old);
    if (old !== call.camTrack && old !== call.screenTrack) old.stop();
  }
  if (track && !call.local.getVideoTracks().includes(track)) call.local.addTrack(track);
  $('#localVideo').srcObject = call.local;
  $('#localVideo').classList.toggle('novid', !track);
  $('#localVideo').classList.toggle('mirror', track === call.camTrack);
  $('#localTile').classList.toggle('hidden', !track);
}
async function callPeer(uid) {
  const c = call, p = c.peers[uid] || makePeer(uid);
  try {
    const offer = await p.pc.createOffer();
    await p.pc.setLocalDescription(offer);
    await sendSignals(c, [uid], 'offer', { sdp: { type: offer.type, sdp: offer.sdp } });
  } catch (e) { console.warn(e); }
}
async function onOffer(from, sdp) {
  const c = call, p = c.peers[from] || makePeer(from), pc = p.pc;
  try {
    if (pc.signalingState !== 'stable' && !p.polite) return;      // glare: the other side wins
    await pc.setRemoteDescription(sdp);
    await flushIce(from);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendSignals(c, [from], 'answer', { sdp: { type: answer.type, sdp: answer.sdp } });
  } catch (e) { console.warn(e); }
}
async function onAnswer(from, sdp) {
  const p = call.peers[from];
  if (!p || p.pc.signalingState !== 'have-local-offer') return;
  try { await p.pc.setRemoteDescription(sdp); await flushIce(from); } catch (e) { console.warn(e); }
}
function addIce(uid, cand) {
  const p = call.peers[uid];
  if (p && p.pc.remoteDescription) p.pc.addIceCandidate(cand).catch(() => {});
  else (call.pendingIce[uid] = call.pendingIce[uid] || []).push(cand);
}
async function flushIce(uid) {
  const p = call.peers[uid], list = call.pendingIce[uid] || [];
  call.pendingIce[uid] = [];
  for (const c of list) { try { await p.pc.addIceCandidate(c); } catch {} }
}
function closePeer(uid) {
  const p = call?.peers[uid];
  if (p) { try { p.pc.close(); } catch {} delete call.peers[uid]; }
  document.getElementById('tile-' + uid)?.remove();
}

/* ---- call screen ---- */
function ensureTile(uid) {
  let el = document.getElementById('tile-' + uid);
  if (!el) {
    el = document.createElement('div'); el.className = 'tile'; el.id = 'tile-' + uid;
    el.innerHTML = `<div class="big" style="${avStyle(profiles[uid]?.avatar_url)}">${avInner(profiles[uid]?.avatar_url, nameFor(uid))}</div><video autoplay playsinline class="novid"></video><span class="lbl">${esc(nameFor(uid))}</span>`;
    $('#callGrid').appendChild(el);
  }
  return { el, video: el.querySelector('video') };
}
function updateTile(uid) {
  const el = document.getElementById('tile-' + uid); if (!el || !call) return;
  const v = el.querySelector('video'), s = v.srcObject;
  const st = call.state[uid] || {};
  const hasVid = s && s.getVideoTracks().length > 0 && st.cam !== false;
  v.classList.toggle('novid', !hasVid);
  let label = nameFor(uid);
  if (st.share) label += ' 🖥️';
  else if (st.mic === false) label += ' 🔇';
  el.querySelector('.lbl').textContent = label;
}
function renderCallPeople() {
  if (!call) return;
  const labels = { joined: 'in call', ringing: 'ringing…', declined: 'declined', busy: 'busy', 'no answer': 'no answer', left: 'left', 'connection failed': 'connection failed' };
  $('#callPeople').innerHTML = others(call).map(u => {
    const s = call.status[u];
    const label = labels[s] || (online.has(u) ? 'online' : 'offline');
    const canRing = online.has(u) && s !== 'joined' && s !== 'ringing';
    return `<span class="pchip">${online.has(u) ? '🟢' : '⚪'} ${esc(nameFor(u))} · ${label}${canRing ? ` <button data-ring="${u}">Ring</button>` : ''}</span>`;
  }).join('');
  $('#callPeople').querySelectorAll('[data-ring]').forEach(b => b.onclick = () => ringMembers([b.dataset.ring]));
}
function broadcastState() { if (call) sendSignals(call, Object.keys(call.peers), 'state', { cam: camOn(), mic: micOn(), share: sharing() }); }
$('#cMic').onclick = () => {
  const t = call?.local.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  $('#cMic').classList.toggle('off', !t.enabled); $('#cMic').textContent = t.enabled ? '🎤' : '🔇';
  broadcastState();
};
$('#cCam').onclick = () => {
  if (sharing()) return; // can't toggle cam while sharing screen
  const t = call?.local.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  $('#cCam').classList.toggle('off', !t.enabled);
  $('#localVideo').classList.toggle('novid', !t.enabled);
  broadcastState();
};
$('#cShare').onclick = async () => {
  if (!call) return;
  if (sharing()) {
    // stop sharing → restore camera if available
    call.screenTrack?.stop();
    call.screenTrack = null;
    $('#cShare').classList.remove('on'); $('#cShare').textContent = '🖥️';
    await replaceVideoTrack(call.camTrack && call.camTrack.readyState === 'live' ? call.camTrack : null);
    broadcastState();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    const track = stream.getVideoTracks()[0];
    if (!track) return;
    call.screenTrack = track;
    track.onended = () => {
      if (call && call.screenTrack === track) {
        call.screenTrack = null;
        $('#cShare').classList.remove('on'); $('#cShare').textContent = '🖥️';
        replaceVideoTrack(call.camTrack && call.camTrack.readyState === 'live' ? call.camTrack : null);
        broadcastState();
      }
    };
    $('#cShare').classList.add('on'); $('#cShare').textContent = '🖥️';
    await replaceVideoTrack(track);
    broadcastState();
  } catch (e) {
    if (e.name !== 'NotAllowedError') console.warn(e);
  }
};
$('#cEnd').onclick = () => hangUp();

function endAfter(msg) {
  if (!call) return;
  const c = call; $('#callTitle').textContent = msg;
  setTimeout(() => { if (call === c) hangUp(); }, 1500);
}
async function hangUp(quiet = false) {
  const c = call; if (!c) return;
  call = null;
  clearInterval(c.timer);
  Object.values(c.peers).forEach(p => { try { p.pc.close(); } catch {} });
  c.screenTrack?.stop();
  c.local.getTracks().forEach(t => t.stop());
  if (c.camTrack && c.camTrack.readyState !== 'ended') try { c.camTrack.stop(); } catch {}
  $('#call').classList.add('hidden');
  $('#callGrid').innerHTML = '';
  $('#localVideo').srcObject = null;
  $('#callChat').classList.remove('open');
  if (quiet) return;
  await sendSignals(c, others(c), 'leave');
  await sb.from('call_signals').delete().eq('call_id', c.id).or(`from_user.eq.${me.id},to_user.eq.${me.id}`);
}

/* ---- call chat ---- */
async function loadCallChat(cid) {
  const box = $('#callMsgs');
  box.innerHTML = '';
  const { data } = await sb.from('messages').select('*').eq('conversation_id', cid).order('created_at', { ascending: false }).limit(40);
  if (!call || call.convId !== cid) return;
  (data || []).reverse().forEach(m => appendCallMsg(m));
  box.scrollTop = box.scrollHeight;
}
function appendCallMsg(m) {
  if (document.querySelector(`#callMsgs [data-mid="${m.id}"]`)) return;
  const mine = m.sender_id === me.id;
  const name = !mine ? (profiles[m.sender_id]?.display_name || '…') : '';
  const div = document.createElement('div');
  div.className = 'msg' + (mine ? ' me' : '');
  div.dataset.mid = m.id;
  div.innerHTML = `${name ? `<div class="nm">${esc(name)}</div>` : ''}${m.body ? `<div class="tx">${esc(m.body)}</div>` : (m.file_name ? `<div class="tx">📎 ${esc(m.file_name)}</div>` : '')}<div class="tm">${fmtTime(m.created_at)}</div>`;
  $('#callMsgs').appendChild(div);
  const box = $('#callMsgs');
  if (box.scrollHeight - box.scrollTop - box.clientHeight < 80) box.scrollTop = box.scrollHeight;
  if (!$('#callChat').classList.contains('open') && !mine) $('#callChatToggle').classList.add('has-new');
}
$('#callChatToggle').onclick = () => {
  const open = $('#callChat').classList.toggle('open');
  if (open) { $('#callChatToggle').classList.remove('has-new'); $('#callText').focus(); }
};
$('#callChatClose').onclick = () => $('#callChat').classList.remove('open');
$('#callSend').onclick = async () => {
  if (!call) return;
  const rateErr = checkRateLimit();
  if (rateErr) { showRateLimit(rateErr); return; }
  const t = $('#callText'); const body = t.value.trim();
  if (!body) return;
  t.value = '';
  const { data, error } = await sb.from('messages').insert({ conversation_id: call.convId, sender_id: me.id, body }).select().single();
  if (error) { t.value = body; return alert(error.message); }
  recordSend();
  appendCallMsg(data);
  if (activeId === call.convId) appendMsg(data);
  bumpConv(call.convId);
};
$('#callText').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#callSend').click(); } };
</script>
</body>
</html>
